<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPS Digital Platform</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b469f">
<style>
:root{
  color-scheme:dark;
  --bg:#06132b; --card:#0e2247; --ink:#eaf1ff; --muted:#93a6c8; --line:#22407a;
  --brand:#3b9bff; --brand-ink:#04122b; --danger:#ff8080; --ok:#5fd093; --warn-bg:#3a2f10; --warn-ink:#f5d27a;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,#12408f 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 "Segoe UI","Leelawadee UI","Noto Sans Thai","Microsoft YaHei","PingFang SC","Noto Sans SC",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=url],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.25);border-radius:99px;overflow:hidden;background:rgba(4,18,43,.45)}
.lang button{border:0;background:none;color:inherit;padding:6px 11px;cursor:pointer;font-size:13px;opacity:.75}
.lang button.on{background:var(--brand);color:var(--brand-ink);font-weight:700;opacity:1}
.auth .lang{display:flex;width:max-content;margin:-8px -8px 10px auto}
.rolesel{width:auto;min-width:92px;padding:5px 6px;font-size:13px}
.ghbar:empty{display:none}
.ghbar{border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;border:1px solid var(--line);background:rgba(59,155,255,.10)}
.ghbar span{flex:1;min-width:200px}
.ghbar.ok{background:rgba(95,208,147,.12);border-color:rgba(95,208,147,.45)}
.ghbar.error{background:rgba(255,128,128,.12);border-color:rgba(255,128,128,.5)}
.ghbar.pending,.ghbar.idle{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.panel a{color:var(--brand)}
label.check{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink);font-size:14px;cursor:pointer}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.auth h1{margin:0 0 4px;font-size:22px}
.auth p{margin:0 0 8px;color:var(--muted);font-size:14px}
.auth .btn{width:100%;margin-top:18px}

/* layout */
header{background:linear-gradient(115deg,#082a6b 0%,#0b469f 50%,#2a86e0 100%);border-bottom:1px solid var(--line);padding:22px 0 18px}
header .in{max-width:1100px;margin:0 auto;padding:0 16px}
header .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .logo{margin-right:auto;display:flex;align-items:center;gap:14px}
header .logo img{width:clamp(48px,7vw,68px);height:auto;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.auth .appicon{display:block;width:120px;height:120px;margin:0 auto 14px;border-radius:26px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.auth h1,.auth p{text-align:center}
header h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.15;letter-spacing:.3px}
header .sub{font-size:clamp(14px,2vw,18px);opacity:.9}
header .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .tools input{width:200px;border-radius:99px;background:rgba(4,18,43,.45);border-color:rgba(255,255,255,.25)}
header .btn{background:rgba(4,18,43,.45);border-color:rgba(255,255,255,.25)}
header .who{display:flex;align-items:center;gap:8px;font-size:13px}
header button.who{background:none;border:1px solid transparent;border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;color:inherit}
header button.who:hover{border-color:rgba(255,255,255,.4);background:rgba(4,18,43,.3)}
header .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b469f;font-weight:700}
.flow{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:16px;font-size:14px}
.flow span{display:flex;align-items:center;gap:6px}
.flow span+span::before{content:"›";opacity:.6;margin-right:8px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner span{flex:1;min-width:220px}

/* portal */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:18px;margin-right:auto}
.toolbar input{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:128px;text-align:center;
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 10px;
  text-decoration:none;color:#fff;box-shadow:var(--shadow);transition:transform .12s,filter .12s}
.app:hover{transform:translateY(-3px);filter:brightness(1.12)}
.app .ico{font-size:36px;line-height:1}
.app b{display:block;font-size:15px;line-height:1.3}
.app small{display:block;font-size:12px;opacity:.85}
.mini{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:18px;background:var(--c)}
.tag.srv{color:var(--s);border-color:var(--s);white-space:nowrap}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--s)}
.sec small{color:var(--muted)}
.sec .n{margin-left:auto;color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);padding:5px 14px;border-radius:99px;cursor:pointer}
.filters button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:720px){.lower{grid-template-columns:1fr}}
.lower h3{margin:0 0 12px;font-size:16px}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;width:86px;padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;text-align:center;text-decoration:none;color:inherit}
.quick a:hover{border-color:var(--brand)}
.quick a span{font-size:22px}
.news{list-style:none;margin:0;padding:0}
.news li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.news li:last-child{border:0}
.news li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--d)}
.install-btn{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:8px;border-radius:99px;padding:8px 16px 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.install-btn[hidden]{display:none}
.install-btn img{width:28px;height:28px;border-radius:7px}
textarea{width:100%;min-height:160px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* settings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.c,th.c{text-align:center}
td.act{white-space:nowrap;text-align:right}
td .url{color:var(--muted);font-size:13px;word-break:break-all}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.admin{color:var(--brand);border-color:var(--brand)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
.matrix th.app-col{font-weight:600;color:var(--ink);min-width:90px;text-align:center}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
</style>
</head>

   Password is never stored: only username + that user's current hash.
   If an Admin resets the password or deletes the user, the hash no longer
   matches and the device is signed out automatically. */
function rememberLogin(u){ lsSet(LS_REMEMBER, JSON.stringify({u: u.username, h: u.hash})); }
function forgetLogin(){ lsSet(LS_REMEMBER, null); }
function currentUserName(){
  const s = sessionStorage.getItem(SS_ME);
  if (s) return s;
  let r = null; try { r = JSON.parse(lsGet(LS_REMEMBER)); } catch {}
  const u = r && cfg.users.find(x => x.username === r.u && x.hash === r.h);
  if (!u){ if (r) forgetLogin(); return null; }
  sessionStorage.setItem(SS_ME, u.username);
  return u.username;
}

}

/* ---------------- SSO mode ----------------
   When sso.json ({"url": "<Apps Script /exec URL>"}) exists next to this file, users, apps and

   real server-side login, settings saved automatically, and one-click sign-in to other apps. */
const LS_SSO = 'cpsPortal.sso';            // session token (also read by sso-gate.js in other apps)
let SSO_URL = '', ssoUser = null, ssoNeedsSetup = false, ssoError = '';
async function sso(action, data = {}){
  const r = await fetch(SSO_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, ...data})});
  const j = await r.json();
  if (!j.ok){ const e = new Error(j.message || j.code); e.code = j.code; throw e; }
  return j.data;
}
const ssoMsg = e => ({BAD_LOGIN:T('loginErr'), LOCKED:T('ssoLocked'), AUTH:T('ssoExpired'), FORBIDDEN:T('ssoForbidden')})[e.code] || e.message || String(e);
function ssoApply(d){
  if (d.token) lsSet(LS_SSO, d.token);
  cfg = {apps: d.apps, news: d.news || [], users: d.users || [d.user], rev: d.rev, updatedAt: 0};
  ssoUser = d.user.username; ssoNeedsSetup = false;
}
function ssoSignOut(){ lsSet(LS_SSO, null); ssoUser = null; cfg = {apps:[], users:[], news:[]}; }
// after signing in from another app's gate (…/cps-portal/?next=<url>) go back to that app
function ssoNext(){
  const n = new URLSearchParams(location.search).get('next');

  return false;
}
function insertParam(url, k, v){
  const i = url.indexOf('#'), base = i < 0 ? url : url.slice(0, i), hash = i < 0 ? '' : url.slice(i);
  return base + (base.includes('?') ? '&' : '?') + k + '=' + encodeURIComponent(v) + hash;
}

const cleanName = s => String(s ?? '').replace(/[\p{C}]/gu, '').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}.)]+$/gu, '').replace(/\s+/g, ' ').trim();

async function hashPw(pw, saltHex){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:unhex(saltHex), iterations:150000}, key, 256);
  return hex(bits);
}
async function makeCred(pw){
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  return {salt, hash: await hashPw(pw, salt)};
}

async function loadCfg(){
  try {
    const r = await fetch('sso.json?_=' + Date.now(), {cache:'no-store'});
    const j = r.ok ? await r.json() : null;
    if (j && /^https?:\/\//.test(j.url || '')) SSO_URL = j.url;
  } catch {}
  if (SSO_URL){
    cfg = {apps:[], users:[], news:[]}; ssoError = '';
    try {
      const token = lsGet(LS_SSO);
      if (token){
        try { ssoApply(await sso('me', {token})); if (ssoNext()) return; }
        catch (e){ if (e.code === 'AUTH') lsSet(LS_SSO, null); else throw e; }
      }
      if (!ssoUser) ssoNeedsSetup = (await sso('status')).setup;
    } catch (e){ ssoError = e.message || String(e); }
    return;
  }
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(LS_CFG)); } catch {}
  try {
    const r = await fetch('config.json?_=' + Date.now(), {cache:'no-store'});
    if (r.ok) remote = await r.json();
  } catch {}
  if (!validCfg(local)) local = null;
  if (!validCfg(remote)) remote = null;
  remoteAt = remote?.updatedAt || 0;
  cfg = (local && remote) ? ((local.updatedAt||0) >= remoteAt ? local : remote)
      : (local || remote || {apps: structuredClone(DEFAULT_APPS), users: [], updatedAt: 0});
}
function saveCfg(){
  if (SSO_URL){                          // saved on the server, batched so quick ticks become one request
    clearTimeout(ghTimer);
    ghState = {status:'pending'};
    ghTimer = setTimeout(ssoSave, 1200);
    return;
  }
  cfg.updatedAt = Date.now();
  try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch {}
  if (isAdmin(me) && ghToken()){        // auto-upload, batched so quick ticks become one commit
    clearTimeout(ghTimer);
    ghState = {status:'pending'};
    ghTimer = setTimeout(ghPublish, 1500);
  }
}

/* ---------------- auto-upload config.json to GitHub ----------------
   Uses a fine-grained token (Contents: read & write on this repo only),
   kept in this admin's browser only. */
const LS_GHTOKEN = 'cpsPortal.ghToken';
const GH = (() => {
  const m = location.hostname.match(/^([\w-]+)\.github\.io$/i);
  const seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner: m ? m[1] : 'changan-cps', repo: m && seg && !seg.includes('.') ? seg : 'cps-portal', path:'config.json', branch:'main'};
})();
const GH_TOKEN_URL = 'https://github.com/settings/personal-access-tokens/new';
let ghState = {status:'idle'};   // idle | pending | saving | ok | error
let ghTimer = null, ghBusy = false, ghAgain = false;
const ghToken = () => lsGet(LS_GHTOKEN);
const b64utf8 = s => { let bin = ''; for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b); return btoa(bin); };
async function ghApi(path, opts = {}, token = ghToken()){
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path ? '/' + path : ''}`, {
    ...opts, cache:'no-store',
    headers:{'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + token, 'X-GitHub-Api-Version':'2022-11-28', ...(opts.body ? {'Content-Type':'application/json'} : {})},
  });
  if (!r.ok){ const e = new Error((await r.json().catch(() => ({}))).message || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return r.json();
}
const ghErrText = e => [401, 403, 404].includes(e.status) ? T('ghBadToken') : (e.message || String(e));
async function ghPublish(){
  if (!ghToken()) return;
  clearTimeout(ghTimer);
  if (ghBusy){ ghAgain = true; return; }
  ghBusy = true; ghState = {status:'saving'}; showGh();
  const at = cfg.updatedAt, body = JSON.stringify(cfg, null, 2) + '\n';
  try {
    for (let attempt = 0; ; attempt++){
      let sha;
      try { sha = (await ghApi(`contents/${GH.path}?ref=${GH.branch}`)).sha; } catch (e){ if (e.status !== 404) throw e; }
      try {
        await ghApi(`contents/${GH.path}`, {method:'PUT', body: JSON.stringify({
          message:`Update config.json from portal (${me?.username || 'admin'})`, content: b64utf8(body), sha, branch: GH.branch})});
        break;
      } catch (e){ if ((e.status === 409 || e.status === 422) && attempt < 2) continue; throw e; }
    }
    remoteAt = Math.max(remoteAt, at);
    ghState = {status: cfg.updatedAt > at ? 'pending' : 'ok'};
  } catch (e){
    ghState = {status:'error', msg: ghErrText(e)};
  }
  ghBusy = false;
  if (ghAgain || ghState.status === 'pending'){ ghAgain = false; ghTimer = setTimeout(ghPublish, 300); }
  showGh();
}
async function ssoSave(){
  clearTimeout(ghTimer);
  if (ghBusy){ ghAgain = true; return; }
  ghBusy = true; ghState = {status:'saving'}; showGh();
  const sent = cfg.users.map(u => u.pw);
  try {
    const d = await sso('save', {token: lsGet(LS_SSO), rev: cfg.rev, apps: cfg.apps, news: cfg.news || [],
      users: cfg.users.map(u => ({username:u.username, name:u.name, role:u.role, apps:u.apps || [], roles:u.roles || {}, pw:u.pw}))});
    cfg.rev = d.rev;
    cfg.users.forEach((u, i) => { if (u.pw === sent[i]) delete u.pw; });
    ghState = {status: ghAgain ? 'pending' : 'ok'};
  } catch (e){
    if (e.code === 'CONFLICT' || e.code === 'AUTH'){      // someone else saved / signed out: reload from server
      ghBusy = false; ghAgain = false; ghState = {status:'error', msg: ssoMsg(e)};
      ssoUser = null; await loadCfg(); return render();
    }
    ghState = {status:'error', msg: ssoMsg(e)};
  }
  ghBusy = false;
  if (ghAgain){ ghAgain = false; ghTimer = setTimeout(ssoSave, 300); }
  showGh();
}
function ghInner(){
  const s = ghState.status;
  if (SSO_URL){
    if (s === 'saving' || s === 'pending') return `<span>${T('ssoSaving')}</span>`;
    if (s === 'error') return `<span>${T('ssoSaveErr', esc(ghState.msg))}</span><button class="btn small" data-act="sso-save">${T('ghRetry')}</button>`;
    return s === 'ok' ? `<span>${T('ssoSaved')}</span>` : '';
  }
  if (s === 'saving') return `<span>${T('ghSaving')}</span>`;
  if (s === 'error') return `<span>${T('ghErr', esc(ghState.msg))}</span><button class="btn small" data-act="gh-publish">${T('ghRetry')}</button>`;
  if (s === 'ok') return `<span>${T('ghOk')}</span>`;
  if (s === 'pending' || unpublished()) return `<span>${T('ghPending')}</span><button class="btn small" data-act="gh-publish">${T('ghPublishNow')}</button>`;
  return '';
}
const ghBarHtml = () => `<div id="ghStatus" class="ghbar ${ghState.status}">${ghInner()}</div>`;
function showGh(){ const el = $('#ghStatus'); if (el){ el.className = 'ghbar ' + ghState.status; el.innerHTML = ghInner(); } }
async function ghConnect(token){
  ghState = {status:'idle'};
  const info = await ghApi('', {}, token);                       // can read the repo?
  if (info.permissions && info.permissions.push === false) { const e = new Error(); e.status = 403; throw e; }
  lsSet(LS_GHTOKEN, token);
}
const isAdmin = u => u?.role === 'admin';

const unpublished = () => !SSO_URL && cfg.users.length && (cfg.updatedAt||0) > remoteAt;

function renderLogin(){
  // keep what was typed when switching language
  const old = $('#loginForm');
  const typedU = old?.u.value, typedP = old?.p.value, typedR = old?.r.checked;
  $('#root').innerHTML = `<div class="auth"><form class="box" id="loginForm">

    <label>${T('password')}</label><input type="password" name="p" required autocomplete="current-password">
    <label class="check"><input type="checkbox" name="r" ${typedR === false ? '' : 'checked'}> ${T('remember')}</label>
    <div class="err" id="err"></div>
    <button class="btn primary">${T('login')}</button>
  </form></div>`;
  const lf = $('#loginForm');
  if (typedP) lf.p.value = typedP;
  (lf.u.value ? lf.p : lf.u).focus();
  lf.onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    if (SSO_URL){
      const btn = f.querySelector('button.primary'); btn.disabled = true; $('#err').textContent = T('ssoWait');
      try {
        ssoApply(await sso('login', {username:f.u.value.trim(), password:f.p.value, remember:f.r.checked}));
        lsSet(LS_LASTUSER, ssoUser);
        if (ssoNext()) return;
        view = 'portal'; q = ''; render();
      } catch (x){ $('#err').textContent = ssoMsg(x); btn.disabled = false; }
      return;
    }
    const u = cfg.users.find(x => x.username.toLowerCase() === f.u.value.trim().toLowerCase());
    if (!u || (await hashPw(f.p.value, u.salt)) !== u.hash) return $('#err').textContent = T('loginErr');
    lsSet(LS_LASTUSER, u.username);
    f.r.checked ? rememberLogin(u) : forgetLogin();
    sessionStorage.setItem(SS_ME, u.username); view = 'portal'; q = ''; render();
  };
}

function portalHtml(){
  const all = myApps();
  const list = all.filter(a => !q || (a.name + ' ' + (a.desc||'') + ' ' + a.url).toLowerCase().includes(q.toLowerCase()));
  const allTiles = all.filter(a => a.kind !== 'quick');
  const usedSrv = SERVERS.filter(s => allTiles.some(a => serverOf(a) === s.id));
  if (!usedSrv.some(s => s.id === srvFilter)) srvFilter = 'all';
  const tiles = list.filter(a => a.kind !== 'quick' && (srvFilter === 'all' || serverOf(a) === srvFilter));
  const quick = list.filter(a => a.kind === 'quick');
  const news = cfg.news || [], dots = ['#3b9bff','#f5b83d','#5fd093','#ff8080'];
  const tile = a => `
      <a class="app" style="--c:${esc(a.color || COLORS[0])}" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.url)}" ${SSO_URL && a.sso === 'ticket' ? `data-ticket="${esc(a.id)}"` : ''}>

        <span><b>${esc(a.name)}</b>${a.desc ? `<small>${esc(a.desc)}</small>` : ''}</span>
      </a>`;
  const sections = SERVERS.map(s => {
    const items = tiles.filter(a => serverOf(a) === s.id);
    return items.length ? `<div class="sec" style="--s:${s.color}"><h2>${s.icon} ${srvLabel(s.id)}</h2><small>${srvHint(s.id)}</small><span class="n">${T('nApps', items.length)}</span></div>
      <div class="grid">${items.map(tile).join('')}</div>` : '';
  }).join('');
  return `
    ${usedSrv.length > 1 ? `<div class="filters">${[{id:'all', icon:''}, ...usedSrv].map(s =>
      `<button class="${srvFilter === s.id ? 'on' : ''}" data-srv="${s.id}">${s.icon} ${s.id === 'all' ? T('all') : srvLabel(s.id)}</button>`).join('')}</div>` : ''}

    : (quick.length ? '' : `<div class="empty">${all.length ? T('noMatch') : T('noApps')}</div>`)}
    ${quick.length || news.length ? `<div class="lower">
      ${quick.length ? `<section class="panel"><h3>${T('quick')}</h3><div class="quick">${quick.map(a => `
        <a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.desc || a.url)}" ${SSO_URL && a.sso === 'ticket' ? `data-ticket="${esc(a.id)}"` : ''}><span>${esc(a.icon || '🔗')}</span>${esc(a.name)}</a>`).join('')}</div></section>` : ''}
      ${news.length ? `<section class="panel"><h3>${T('news')}</h3><ul class="news">${news.map((n,i) => `<li style="--d:${dots[i % dots.length]}">${esc(n)}</li>`).join('')}</ul></section>` : ''}
    </div>` : ''}`;
}

function openDlg(html, onSubmit){
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" id="dlgForm">${html}<div class="err" id="derr"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlgCancel">${T('cancel')}</button><button class="btn primary">${T('save')}</button></div></form>`;
  $('#dlgCancel').onclick = () => d.close();
  $('#dlgForm').onsubmit = async e => {
    e.preventDefault();
    const msg = await onSubmit(e.target);
    if (msg) return $('#derr').textContent = msg;
    d.close(); render();
  };
  d.showModal();
}

function appDlg(i){
  const a = i == null ? {icon:ICONS[cfg.apps.length % ICONS.length], color:COLORS[cfg.apps.length % COLORS.length]} : cfg.apps[i];
  openDlg(`<h3>${i == null ? T('addAppT') : T('editAppT')}</h3>
    <label>${T('appName')}</label><input type="text" name="name" required value="${esc(a.name)}">
    <label>${T('url')}</label><input type="url" name="url" required placeholder="https://…" value="${esc(a.url)}">
    <label>${T('desc')}</label><input type="text" name="desc" value="${esc(a.desc)}">
    <label>${T('serverType')}</label><select name="server">${SERVERS.map(s => `<option value="${s.id}" ${(i == null ? 'external' : serverOf(a)) === s.id ? 'selected' : ''}>${s.icon} ${srvLabel(s.id)} — ${srvHint(s.id)}</option>`).join('')}</select>
    <label>${T('position')}</label><select name="kind"><option value="tile">${T('posTile')}</option><option value="quick" ${a.kind==='quick'?'selected':''}>${T('posQuick')}</option></select>
    ${SSO_URL ? `<label>${T('appSso')}</label><select name="sso"><option value="">${T('ssoModeOff')}</option><option value="ticket" ${a.sso==='ticket'?'selected':''}>${T('ssoModeTicket')}</option></select>
    <label>${T('appRoles')}</label><input type="text" name="roles" placeholder="admin, auditor, viewer" value="${esc((a.roles||[]).join(', '))}">` : ''}
    <div class="row"><div><label>${T('icon')}</label><select name="icon">${[...new Set([a.icon, ...ICONS])].filter(Boolean).map(x => `<option ${x===a.icon?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>${T('color')}</label><input type="color" name="color" value="${esc(a.color||COLORS[0])}" style="width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--card)"></div></div>`,
  f => {
    const url = f.url.value.trim();
    if (!/^https?:\/\//i.test(url)) return T('urlErr');
    const data = {name:f.name.value.trim(), url, desc:f.desc.value.trim(), kind:f.kind.value, server:f.server.value, icon:f.icon.value, color:f.color.value};
    if (SSO_URL){ data.sso = f.sso.value; data.roles = f.roles.value.split(',').map(x => x.trim()).filter(Boolean); }
    if (i == null){
      let id = slug(data.name), n = 2;
      while (cfg.apps.some(x => x.id === id)) id = slug(data.name) + '-' + n++;
      cfg.apps.push({id, ...data});
    } else Object.assign(cfg.apps[i], data);
    saveCfg();
  });
  // new app: pick the server type from the URL until the admin chooses one
  if (i == null){
    const f = $('#dlgForm'); let touched = false;
    f.server.onchange = () => touched = true;
    f.url.oninput = () => { if (!touched) f.server.value = guessServer(f.url.value.trim()); };
  }
}

function userDlg(i){
  const u = i == null ? {role:'user'} : cfg.users[i];
  const isNew = i == null;
  openDlg(`<h3>${isNew ? T('addUserT') : T('editUserT')}</h3>
    <label>${T('username')}</label><input type="text" name="u" required value="${esc(u.username)}" ${isNew?'':'readonly'} autocomplete="off">
    <label>${T('displayName')}</label><input type="text" name="n" value="${esc(isNew ? '' : dispName(u))}">
    <label>${T('role')}</label><select name="role"><option value="user" ${u.role!=='admin'?'selected':''}>${T('roleUser')}</option><option value="admin" ${u.role==='admin'?'selected':''}>${T('roleAdmin')}</option></select>
    <label>${isNew ? T('pwMin') : T('pwNew')}</label><input type="password" name="p" ${isNew?'required':''} minlength="6" autocomplete="new-password">`,
  async f => {
    const username = f.u.value.trim(), role = f.role.value;
    if (isNew && cfg.users.some(x => x.username.toLowerCase() === username.toLowerCase())) return T('userExists');
    if (!isNew && u.role === 'admin' && role !== 'admin' && cfg.users.filter(isAdmin).length === 1) return T('needAdmin');
    const cred = !f.p.value ? {} : SSO_URL ? {pw: f.p.value} : await makeCred(f.p.value);
    const name = cleanName(f.n.value) || username;
    if (isNew) cfg.users.push({username, name, role, apps:[], ...cred});
    else Object.assign(u, {name, role, ...cred});
    saveCfg();
  });
}

// every user can edit their own display name / password
function profileDlg(){
  openDlg(`<h3>${T('profile')}</h3>
    <label>${T('usernameRO')}</label><input type="text" value="${esc(me.username)}" readonly>
    <label>${T('displayName')}</label><input type="text" name="n" required maxlength="60" value="${esc(dispName(me))}" autofocus>
    <label>${T('pwNew')}</label><input type="password" name="p" minlength="6" autocomplete="new-password">
    <label>${T('pwNewConfirm')}</label><input type="password" name="p2" autocomplete="new-password">
    ${isAdmin(me) ? '' : `<p class="hint">${T('profileHint')}</p>`}`,
  async f => {
    const name = cleanName(f.n.value);
    if (!name) return T('needName');
    if (f.p.value && f.p.value !== f.p2.value) return T('pwMismatch');
    if (SSO_URL){
      try { const d = await sso('profile', {token: lsGet(LS_SSO), name, password: f.p.value || undefined});
            lsSet(LS_SSO, d.token); me.name = d.user.name; cfg.rev = d.rev; }
      catch (x){ return ssoMsg(x); }
      return;
    }
    const remembered = (() => { try { return JSON.parse(lsGet(LS_REMEMBER))?.u === me.username; } catch { return false; } })();
    Object.assign(me, {name}, f.p.value ? await makeCred(f.p.value) : {});
    if (remembered) rememberLogin(me);
    saveCfg();
  });
}

/* ---------------- events ---------------- */
// SSO apps: open a tab right away (keeps pop-up blockers happy), then send it to the app with a 2-minute ticket
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-ticket]');
  if (!a || !SSO_URL || e.defaultPrevented) return;
  e.preventDefault();
  const w = window.open('', '_blank');
  if (w) w.document.write(`<body style="margin:0;display:grid;place-items:center;height:100vh;background:#06132b;color:#eaf1ff;font:16px 'Segoe UI',sans-serif">${esc(T('ssoOpening'))}</body>`);
  sso('ticket', {token: lsGet(LS_SSO), app: a.dataset.ticket}).then(d => {
    const url = insertParam(a.href, 'sso', d.ticket);
    if (w) w.location.replace(url); else location.href = url;
  }).catch(x => {
    if (w) w.close();
    if (x.code === 'AUTH'){ ssoSignOut(); return loadCfg().then(render); }
    alert(ssoMsg(x));
  });
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-srv],[data-lang]');
  if (!t) return;
  if (t.dataset.lang){ lang = t.dataset.lang; lsSet(LS_LANG, lang); return render(); }
  if (t.dataset.act === 'sso-reload') return loadCfg().then(render);
  if (t.dataset.tab){ tab = t.dataset.tab; return render(); }
  if (t.dataset.srv){ srvFilter = t.dataset.srv; return render(); }
  const i = t.dataset.i != null ? +t.dataset.i : null;
  const admin = isAdmin(me);
  switch (t.dataset.act){
    case 'logout': sessionStorage.removeItem(SS_ME); forgetLogin(); if (SSO_URL) ssoSignOut(); view = 'portal'; return render();
    case 'profile': return profileDlg();
    case 'go-portal': view = 'portal'; return render();
    case 'go-settings': if (admin){ view = 'settings'; render(); } return;
  }
  if (!admin) return;
  switch (t.dataset.act){
    case 'app-new': return appDlg(null);
    case 'app-edit': return appDlg(i);
    case 'app-up': case 'app-down': {
      const j = i + (t.dataset.act === 'app-up' ? -1 : 1);
      [cfg.apps[i], cfg.apps[j]] = [cfg.apps[j], cfg.apps[i]]; saveCfg(); return render();
    }
    case 'app-del':
      if (!confirm(T('confirmDelApp', cfg.apps[i].name))) return;
      { const id = cfg.apps[i].id; cfg.apps.splice(i,1); cfg.users.forEach(u => u.apps = (u.apps||[]).filter(x => x !== id)); }
      saveCfg(); return render();
    case 'user-new': return userDlg(null);
    case 'user-edit': return userDlg(i);
    case 'user-del':
      if (cfg.users[i].username === me.username) return;
      if (!confirm(T('confirmDelUser', cfg.users[i].username))) return;
      cfg.users.splice(i,1); saveCfg(); return render();
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'}));
      a.download = SSO_URL ? 'cps-portal-backup.json' : 'config.json'; a.click(); URL.revokeObjectURL(a.href); return;
    }
    case 'import': return $('#importFile').click();
    case 'gh-publish': return ghPublish();
    case 'sso-save': return ssoSave();
    case 'gh-disconnect': lsSet(LS_GHTOKEN, null); ghState = {status:'idle'}; return render();
    case 'reset-local':
      if (!confirm(T('confirmReset'))) return;
      localStorage.removeItem(LS_CFG); sessionStorage.removeItem(SS_ME); return loadCfg().then(render);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files[0] && isAdmin(me)){
    t.files[0].text().then(txt => {
      let c; try { c = JSON.parse(txt); } catch {}
      if (!validCfg(c) || !c.users.some(isAdmin)) return alert(T('badFile'));
      cfg = c; saveCfg(); render();
    });
    return;
  }
  if (!isAdmin(me)) return;
  if (t.id === 'newsBox'){
    cfg.news = t.value.split('\n').map(s => s.trim()).filter(Boolean); saveCfg(); return render();
  }
  if (t.dataset.role){
    const [un, id] = t.dataset.role.split('|');
    const u = cfg.users.find(x => x.username === un); if (!u) return;
    const s = new Set(u.apps || []); u.roles = u.roles || {};
    if (t.value){ s.add(id); u.roles[id] = t.value; } else { s.delete(id); delete u.roles[id]; }
    u.apps = [...s]; saveCfg(); return render();
  }
  if (t.dataset.perm){
    const [un, id] = t.dataset.perm.split('|');
    const u = cfg.users.find(x => x.username === un); if (!u) return;
    const s = new Set(u.apps || []); t.checked ? s.add(id) : s.delete(id);
    u.apps = [...s]; saveCfg(); render();
  } else if (t.dataset.permall){
    const u = cfg.users.find(x => x.username === t.dataset.permall); if (!u) return;
    u.apps = t.checked ? cfg.apps.map(a => a.id) : []; saveCfg(); render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  q = e.target.value; render();
  const el = $('#q'); el.focus(); el.setSelectionRange(q.length, q.length);
});

/* ---------------- install as app (PWA) ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
const installBtn = document.createElement('button');
installBtn.className = 'btn primary install-btn';
installBtn.innerHTML = '<img src="favicon.png" alt=""> ';
installBtn.appendChild(document.createTextNode(' ' + T('install')));
installBtn.hidden = true;
document.body.appendChild(installBtn);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; installBtn.hidden = true; });
installBtn.onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; installBtn.hidden = true;
};

document.addEventListener('submit', async e => {
  if (e.target.id !== 'ghForm' || !isAdmin(me)) return;
  e.preventDefault();
  const token = e.target.t.value.trim(), err = $('#ghErr'), btn = e.target.querySelector('button');
  btn.disabled = true; err.textContent = T('ghChecking');
  try {
    await ghConnect(token);
    render();
    if (unpublished()) ghPublish();
  } catch (x){ err.textContent = ghErrText(x); btn.disabled = false; }
});

loadCfg().then(render);
</script>
</body>
</html>
