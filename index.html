<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPS Digital Platform</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00467f">
<style>
:root{
  color-scheme:light;
  --bg:#f2f5f9; --card:#fff; --ink:#132238; --muted:#4f5f76; --line:#d6dee9; --line-2:#e7ecf3; --field:#7a8aa0;
  --brand:#00467f; --brand-2:#0b5cad; --brand-deep:#003563; --tint:#e8f0f8;
  --danger:#b42318; --ok:#127a5e; --warn-bg:#fff4d6; --warn-ink:#6b4a00; --warn-line:#f0d58a;
  --focus:#0b5cad;
  --shadow-h:0 2px 4px rgba(0,0,0,.07),0 12px 28px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);caret-color:var(--brand);
  font:15px/1.55 "Segoe UI","Leelawadee UI","Noto Sans Thai","Microsoft YaHei","PingFang SC","Noto Sans SC",Tahoma,sans-serif}
::selection{background:#cfe0f1;color:var(--ink)}
*{scrollbar-color:#b9c6d6 transparent;scrollbar-width:thin}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2);text-underline-offset:3px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--brand-2);background:var(--tint)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.danger{color:var(--danger)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px;gap:6px}
.btn.small .ic{width:15px;height:15px}
input[type=text],input[type=password],input[type=url],input[type=search],select{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--field);border-radius:8px;background:var(--card);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
input::placeholder,textarea::placeholder{color:#5f6e84}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;color:var(--muted);min-width:44px;min-height:38px;padding:0 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.lang button+button{border-left:1px solid var(--line)}
.lang button:hover{background:var(--tint);color:var(--ink)}
.lang button.on{background:var(--brand);color:#fff;font-weight:700}
.auth .lang{display:flex;width:max-content;margin:0 0 18px auto}
.auth .lang button{min-height:44px}
.embed{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.ebar{flex:none;display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--brand);color:#fff}
.ebar b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ebar .btn{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.ebar .btn:hover{background:rgba(255,255,255,.14)}
.embed iframe{flex:1;width:100%;border:0;background:#fff}
.rolesel{width:auto;min-width:92px;min-height:36px;padding:5px 6px;font-size:13px}
.ghbar:empty{display:none}
.ghbar{border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;border:1px solid var(--line);background:var(--tint)}
.ghbar span{flex:1;min-width:200px}
.ghbar.ok{background:#e3f4ee;border-color:#9fd5c3}
.ghbar.error{background:#fdecea;border-color:#f1b0a8}
.ghbar.pending,.ghbar.idle{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.panel a{color:var(--brand-2)}
label.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;color:var(--ink);font-size:14px;font-weight:400;cursor:pointer}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}
.err:empty{min-height:0;margin:0}

/* auth, loading, error */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 26px 26px}
.auth .appicon{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:22px}
.auth h1{margin:0 0 4px;font-size:22px;line-height:1.25;text-align:center;color:var(--brand);letter-spacing:-.01em}
.auth p{margin:0 0 8px;color:var(--muted);font-size:14px;text-align:center}
.auth .btn{width:100%;margin-top:16px;min-height:48px;font-size:16px}
.auth details{margin-top:14px;font-size:13px;color:var(--muted)}
.auth summary{cursor:pointer;padding:6px 0}
.auth details code{display:block;margin-top:6px;padding:8px 10px;background:var(--bg);border-radius:6px;word-break:break-all;font-size:12px}
.loading{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-size:15px}
.loading .appicon{margin-bottom:6px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.6s}}
/* touch screens on the shop floor: bigger targets */
@media (pointer:coarse){
  .btn{min-height:48px}
  .btn.small{min-height:44px;padding:6px 12px}
  .lang button{min-height:48px;min-width:48px}
  input[type=text],input[type=password],input[type=url],input[type=search],select{min-height:48px}
  .rolesel{min-height:44px}
  .tabs button{min-height:48px}
}

/* header */
.in{max-width:1100px;margin:0 auto;padding:0 16px}
.hd{background:var(--card);border-bottom:2px solid var(--brand);position:sticky;top:0;z-index:10}
.hd .top{position:relative;display:flex;align-items:center;gap:10px;min-height:66px}
.brand{margin-right:auto;display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:44px;height:44px;border-radius:11px;flex:none}
.brand div{min-width:0}
.brand .wm{display:block;height:12px;width:auto;margin:1px 0 3px}
.brand h1{margin:0;display:block;font-size:21px;font-weight:700;line-height:1.2;color:var(--brand);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid transparent;border-radius:99px;padding:3px 12px 3px 3px;background:none;cursor:pointer;color:var(--ink);font-size:14px;max-width:220px}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who:hover,.who[aria-expanded=true]{border-color:var(--line);background:var(--bg)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:#fff;font-weight:700;flex:none}
.tagline{border-top:1px solid var(--line-2);font-size:12px;color:var(--brand)}
.tagline .in{padding-top:5px;padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:0;top:calc(100% - 2px);z-index:30;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-h);padding:6px}
.menu .me{padding:10px 10px 12px;border-bottom:1px solid var(--line-2);margin-bottom:6px}
.menu .me b{display:block;overflow:hidden;text-overflow:ellipsis}
.menu .me small{color:var(--muted);font-size:13px}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;font-size:15px;color:var(--ink)}
.menu .mi:hover{background:var(--bg)}
.menu .mi .ic{color:var(--muted)}
.menu .mi.danger,.menu .mi.danger .ic{color:var(--danger)}
.menu .mi.danger{margin-top:6px;border-top:1px solid var(--line-2);border-radius:0 0 8px 8px}
.menu .ml{font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px 6px}
.menu .lang{display:flex;margin:0 10px 8px}
.menu .lang button{flex:1;min-height:44px}
.langsel{display:none;width:auto;min-height:44px;padding:6px 4px;font-size:14px;border-color:var(--line)}
@media (max-width:900px){
  .who .nm,.tools .adm .txt{display:none}
  .tools .adm{padding:8px 11px}
}
@media (max-width:640px){
  .hd{position:static}
  .tools .lang,.tools .adm{display:none}
  .langsel{display:block}
  .who{padding:3px}
  .brand h1{font-size:17px}
  .brand{gap:10px}
  .brand span,.tagline{display:none}
  .ft{display:block}
  .brand img{width:40px;height:40px}
  .hd .top{min-height:60px}
}

/* portal */
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner span{flex:1;min-width:220px}
.search{position:relative;margin:2px 0 6px}
.search>.ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{min-height:48px;padding-left:44px;padding-right:48px;border-radius:10px}
.search input::-webkit-search-cancel-button{display:none}
.search button{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.search button:hover{background:var(--bg);color:var(--ink)}
.search button[hidden]{display:none}
.sec{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;margin:24px 0 10px}
.sec h2{grid-row:1;margin:0;font-size:18px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.sec h2 .ic{color:var(--brand)}
.sec p{grid-row:2;grid-column:1/-1;margin:0;color:var(--muted);font-size:13px}
.sec .n{grid-row:1;grid-column:2;color:var(--muted);font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));grid-auto-rows:1fr;gap:10px}
.app{display:flex;align-items:center;gap:14px;min-height:78px;padding:12px 12px 12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  text-decoration:none;color:var(--ink);transition:border-color .15s,background-color .15s}
.app:hover{border-color:var(--brand-2);background:#f8fbfe}
.app:active{background:var(--tint)}
.app .ico{flex:none;width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font-size:26px;line-height:1;
  background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 28%,#fff)}
.app .tx{min-width:0;flex:1}
.app b{display:block;font-size:15px;line-height:1.3}
.app small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.tw{position:relative;display:flex}
.tw>.app{flex:1;min-width:0}
.tw .app{padding-right:60px}
.pin{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:48px;height:48px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.pin:hover{background:var(--tint);color:var(--brand)}
.pin[aria-pressed=true]{color:var(--brand)}
.pin[aria-pressed=true] .ic{fill:currentColor}
.mine{background:var(--tint);border-radius:14px;padding:4px 14px 14px;margin-top:4px}
.mine .sec{margin-top:12px}
.mine .app{min-height:88px;background:#fff;border-color:#c9d8e8}
.mine .app:hover{border-color:var(--brand-2)}
.mine .app .ico{width:56px;height:56px;font-size:30px;background:#fff}
.mine .app b{font-size:16.5px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.help{margin:16px 0 0;font-size:13.5px;color:var(--muted);text-align:center;text-wrap:balance}
.help b{color:var(--ink)}
.ft{display:none;margin:8px 16px 24px;font-size:12px;line-height:1.7;color:var(--brand);text-align:center;text-wrap:balance}
@media (max-width:640px){.toast{bottom:84px}.ft{display:block}}
.empty .who-am{margin-top:10px;color:var(--ink)}
.plant-dlg p{margin:6px 0 0;color:var(--muted)}
.sec .btn{grid-row:1;grid-column:2}
.app.pick{width:100%;text-align:left;font:inherit;cursor:pointer}
.app.pick.on{border-color:var(--brand);background:var(--tint)}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--field);display:grid;place-items:center;color:#fff;background:#fff}
.app.pick.on .chk{background:var(--brand);border-color:var(--brand)}
.chk .ic{width:16px;height:16px}
.mine.editing{outline:2px dashed var(--brand-2);outline-offset:-2px}
.empty>.ic{width:40px;height:40px;color:var(--brand)}
.empty h2{margin:10px 0 6px;font-size:18px;color:var(--ink)}
.empty p{margin:6px 0 0}
.auth .errhead{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:4px}
.auth .errhead .ic{width:34px;height:34px;color:var(--danger)}
.auth .errmsg{color:var(--ink);font-size:15px}
.btn.primary.danger-fill{background:var(--danger);border-color:var(--danger)}
.btn.primary.danger-fill:hover{background:#8f1c13;border-color:#8f1c13}
dialog h3{font-size:17px;line-height:1.4}
.matrix tr>th:first-child{position:sticky;left:0;z-index:1;background:var(--card)}
.badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;white-space:nowrap;word-break:keep-all;font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn-bg);border-radius:6px;padding:2px 8px}
.badge .ic{width:13px;height:13px}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
@media (max-width:720px){.lower{grid-template-columns:1fr}}
.lower.one{grid-template-columns:1fr}
.lower h2{margin:0 0 12px;font-size:18px;display:flex;align-items:center;gap:8px}
.lower h2 .ic{color:var(--brand)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;width:100px;min-height:78px;padding:10px 6px;border-radius:10px;background:var(--bg);border:1px solid var(--line-2);font-size:12.5px;line-height:1.3;text-align:center;text-decoration:none;color:var(--ink)}
.quick a:hover{border-color:var(--brand-2)}
.quick a>span[aria-hidden]{font-size:22px}
.quick a b{font-weight:400}
.news{list-style:none;margin:0;padding:0}
.news li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.news li:last-child{border:0}
.news li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px;background:var(--brand)}
.hint-ios{display:flex;align-items:center;gap:10px;margin-top:24px;padding:10px 12px;background:var(--tint);border-radius:10px;font-size:14px}
.hint-ios>.ic{color:var(--brand)}
.hint-ios span{flex:1}
.install-btn{position:fixed;right:16px;bottom:16px;z-index:20;border-radius:99px;padding:6px 16px 6px 6px;box-shadow:var(--shadow-h)}
.install-btn[hidden]{display:none}
.install-btn img{width:30px;height:30px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;width:max-content;max-width:calc(100vw - 32px);background:#1d2b40;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow-h);font-size:14px}
.toast[hidden]{display:none}
textarea{width:100%;min-height:160px;padding:10px 12px;border:1px solid var(--field);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.empty{text-align:center;color:var(--muted);padding:44px 10px}
.empty .btn{margin-top:14px}

/* settings */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:18px;margin-right:auto}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;min-height:44px;padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.c,th.c{text-align:center}
td.act{white-space:nowrap;text-align:right}
td .url{color:var(--muted);font-size:13px;word-break:break-all}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag .ic{width:13px;height:13px}
.tag.admin{color:var(--brand);border-color:var(--brand)}
.tag.srv{color:var(--s);border-color:currentColor;white-space:nowrap}
.mini{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;font-size:18px;background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 28%,#fff)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand);cursor:pointer;flex:none}
.matrix th.app-col{font-weight:600;color:var(--ink);min-width:90px;text-align:center}
.matrix th.app-col .ic{width:14px;height:14px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(460px,94vw);box-shadow:var(--shadow-h)}
dialog::backdrop{background:rgba(16,35,60,.45)}
dialog h3{margin:0 0 4px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>

<script>
/* =========================================================
   CPS Digital Platform — single page, no server needed.
   Data (apps / users / permissions) lives in config.json next to this
   file plus this browser's localStorage (newest copy wins).
   UI languages: 中文 / English / ไทย
   ========================================================= */
const LS_CFG = 'cpsPortal.cfg', SS_ME = 'cpsPortal.me';
const LS_REMEMBER = 'cpsPortal.remember', LS_LASTUSER = 'cpsPortal.lastUser', LS_LANG = 'cpsPortal.lang';

const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

/* ---------------- i18n ---------------- */
const LANGS = [['th','ไทย'], ['zh','中文'], ['en','EN']];
const I18N = {
  zh: {
    search:'🔍 搜索…', searchAria:'搜索应用', settings:'⚙️ 权限设置', back:'← 返回菜单', editProfile:'修改显示名称 / 密码', logout:'退出登录',
    bannerPortal:'⚠️ 本设备有尚未发布的修改 — 手机和其他设备仍显示旧的应用和权限，需将 <b>config.json</b> 上传到 GitHub 后才会更新',
    bannerSettings:'⚠️ 修改仅保存在当前浏览器 — 请下载 <b>config.json</b> 并上传到网站，其他设备才能看到',

function detectLang(){
  const saved = lsGet(LS_LANG);
  if (I18N[saved]) return saved;
  const nav = (navigator.languages || [navigator.language || '']).join(',').toLowerCase();
  return /(^|,)zh/.test(nav) ? 'zh' : /(^|,)th/.test(nav) ? 'th' : 'en';
}
let lang = detectLang();
const T = (k, ...a) => { const v = I18N[lang][k] ?? I18N.en[k], r = typeof v === 'function' ? v(...a) : v;
  return typeof r === 'string' ? r.replace(/^(?:\p{Extended_Pictographic}\uFE0F?\s*)+/u, '') : r; };
const langSwitch = () => `<div class="lang" role="group" aria-label="${esc(T('langLabel'))}">${LANGS.map(([k,l]) =>
  `<button type="button" class="${k === lang ? 'on' : ''}" data-lang="${k}" lang="${k === 'zh' ? 'zh-CN' : k}" aria-pressed="${k === lang}">${l}</button>`).join('')}</div>`;
const langSelect = () => `<select class="langsel" data-langsel aria-label="${esc(T('langLabel'))}">${LANGS.map(([k,l]) =>
  `<option value="${k}" ${k === lang ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
function applyLang(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  if (typeof installBtn !== 'undefined') installBtn.lastChild.textContent = ' ' + T('install');
}

/* --- remember login on this device ---
   Password is never stored: only username + that user's current hash.
   If an Admin resets the password or deletes the user, the hash no longer
   matches and the device is signed out automatically. */
function rememberLogin(u){ lsSet(LS_REMEMBER, JSON.stringify({u: u.username, h: u.hash})); }
function forgetLogin(){ lsSet(LS_REMEMBER, null); }
function currentUserName(){
  const s = sessionStorage.getItem(SS_ME);
  if (s) return s;
  let r = null; try { r = JSON.parse(lsGet(LS_REMEMBER)); } catch {}
  const u = r && cfg.users.find(x => x.username === r.u && x.hash === r.h);
  if (!u){ if (r) forgetLogin(); return null; }
  sessionStorage.setItem(SS_ME, u.username);
  return u.username;
}

const SERVERS = [
  {id:'external', icon:'globe',   color:'#0b5cad'},
  {id:'factory',  icon:'factory', color:'#127a5e'},
];
const srvLabel = id => T('srv')[id][0], srvHint = id => T('srv')[id][1];
// Guess from URL: localhost / private IP / bare LAN hostname = Factory, otherwise External
function guessServer(url){
  let h = ''; try { h = new URL(url).hostname; } catch { return 'external'; }
  if (h === 'localhost' || h.endsWith('.local') || h.endsWith('.lan') || !h.includes('.')) return 'factory';
  if (/^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)) return 'factory';
  return 'external';
}
const serverOf = a => SERVERS.some(s => s.id === a.server) ? a.server : guessServer(a.url);
const serverInfo = a => SERVERS.find(s => s.id === serverOf(a));
const serverTag = a => { const s = serverInfo(a); return `<span class="tag srv" style="--s:${s.color}">${ic(s.icon)}${srvLabel(s.id)}</span>`; };

/* ---------------- apps inside the portal window ----------------
   Installed as an app (standalone window), a tile for an app on this same site opens INSIDE the portal window

      try {

function renderSetup(){
  $('#root').innerHTML = `<main class="auth"><form class="box" id="setupForm">
    ${langSwitch()}
    <img class="appicon" src="icon.webp" alt="" width="96" height="96">
    <h1>${T('setupTitle')}</h1>
    <p>${T('setupSub')}</p>
    <label>${T('username')}</label><input type="text" name="u" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <label>${T('displayName')}</label><input type="text" name="n">
    <label>${T('pwMin')}</label><input type="password" name="p" required minlength="6" autocomplete="new-password">
    <label>${T('pwConfirm')}</label><input type="password" name="p2" required autocomplete="new-password">
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary">${T('createAdmin')}</button>
  </form></main>`;
  $('#setupForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, u = f.u.value.trim();
    if (f.p.value !== f.p2.value) return $('#err').textContent = T('pwMismatch');
    if (SSO_URL){
      const btn = f.querySelector('button.primary'); btn.disabled = true; $('#err').textContent = T('ssoWait');
      try {
        let old = null; try { const r = await fetch('config.json?_=' + Date.now(), {cache:'no-store'}); if (r.ok) old = await r.json(); } catch {}
        const apps = (validCfg(old) ? old.apps : structuredClone(DEFAULT_APPS)).map(a => ({...a, server: serverOf(a)}));
        ssoApply(await sso('setup', {username:u, name:cleanName(f.n.value) || u, password:f.p.value, remember:true, apps, news: old?.news || []}));
        view = 'settings'; tab = 'users'; render();
      } catch (x){ $('#err').textContent = ssoMsg(x); btn.disabled = false; }
      return;
    }
    cfg.users.push({username:u, name:cleanName(f.n.value) || u, role:'admin', apps:[], ...(await makeCred(f.p.value))});
    saveCfg(); sessionStorage.setItem(SS_ME, u); view = 'settings'; tab = 'users'; render();
  };
}

function renderLogin(){
  // keep what was typed when switching language
  const old = $('#loginForm');
  const typedU = old?.u.value, typedP = old?.p.value, typedR = old?.r.checked;
  $('#root').innerHTML = `<main class="auth"><form class="box" id="loginForm">
    ${langSwitch()}
    <img class="appicon" src="icon.webp" alt="" width="96" height="96">
    <h1>CPS Digital Platform</h1>
    <p>${T('loginSub')}</p>
    <label>${T('username')}</label><input type="text" name="u" required autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" value="${esc(typedU ?? lsGet(LS_LASTUSER) ?? '')}">
    <label>${T('password')}</label><input type="password" name="p" required autocomplete="current-password">
    <label class="check"><input type="checkbox" name="r" ${(typedR ?? lsGet('cpsPortal.rememberPref') === '1') ? 'checked' : ''}> ${T('remember')}</label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn primary">${T('login')}</button>
    ${helpHtml()}
  </form></main>`;
  const lf = $('#loginForm');
  if (typedP) lf.p.value = typedP;
  (lf.u.value ? lf.p : lf.u).focus();
  lf.onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    lsSet('cpsPortal.rememberPref', f.r.checked ? '1' : '0');
    if (SSO_URL){
      const btn = f.querySelector('button.primary'); btn.disabled = true; $('#err').textContent = T('ssoWait');
      try {
        ssoApply(await sso('login', {username:f.u.value.trim(), password:f.p.value, remember:f.r.checked}));
        lsSet(LS_LASTUSER, ssoUser);
        if (ssoNext()) return;
        view = 'portal'; q = ''; render();
      } catch (x){ $('#err').textContent = ssoMsg(x); btn.disabled = false; }
      return;
    }
    const u = cfg.users.find(x => x.username.toLowerCase() === f.u.value.trim().toLowerCase());
    if (!u || (await hashPw(f.p.value, u.salt)) !== u.hash) return $('#err').textContent = T('loginErr');
    lsSet(LS_LASTUSER, u.username);
    f.r.checked ? rememberLogin(u) : forgetLogin();
    sessionStorage.setItem(SS_ME, u.username); view = 'portal'; q = ''; render();
  };
}

function portalHtml(){
  if (myApps().length <= 4 && !q) return `<div id="pbody">${portalBody()}</div>`;      // nothing worth searching (and no pins)
  return `<div class="search">${ic('search')}<input type="search" id="q" placeholder="${esc(T('search'))}" value="${esc(q)}" aria-label="${esc(T('searchAria'))}" autocomplete="off" enterkeyhint="search">
      <button type="button" data-act="clear-q" aria-label="${esc(T('clearSearch'))}" ${q ? '' : 'hidden'}>${ic('x')}</button></div>
    <p id="qstat" class="sr" aria-live="polite"></p><p id="pinstat" class="sr" aria-live="polite"></p>
    <div id="pbody">${portalBody()}</div>`;
}
function portalBody(){
  const all = myApps(), ql = q.trim().toLowerCase();
  const list = all.filter(a => !ql || (a.name + ' ' + (a.desc || '') + ' ' + a.id).toLowerCase().includes(ql));
  const tiles = list.filter(a => a.kind !== 'quick');
  const quick = list.filter(a => a.kind === 'quick');
  const news = cfg.news || [];
  const allTiles = all.filter(a => a.kind !== 'quick');
  const pins = pinIds().filter(id => allTiles.some(a => a.id === id));
  const mineIds = ql || allTiles.length <= 4 ? [] : pins.length ? pins : recentIds().filter(id => allTiles.some(a => a.id === id));
  const mine = mineIds.map(id => allTiles.find(a => a.id === id));
  const tile = a => { const d = descOf(a), plant = serverOf(a) === 'factory', on = pins.includes(a.id);
    return `<div class="tw"><a class="app" style="--c:${esc(a.color || COLORS[0])}" href="${esc(a.url)}" target="_blank" rel="noopener" data-app="${esc(a.id)}" ${plant ? 'data-plant="1"' : ''} ${SSO_URL && a.sso === 'ticket' ? `data-ticket="${esc(a.id)}"` : ''}>
        <span class="ico" aria-hidden="true">${esc(a.icon || '🔗')}</span>
        <span class="tx"><b>${esc(a.name)}</b>${d ? `<small>${esc(d)}</small>` : ''}${plant ? `<span class="badge">${ic('factory')}${T('plantOnly')}</span>` : ''}<span class="sr"> (${T('newTab')})</span></span></a>
        </div>`; };
  const pick = a => { const on = pins.includes(a.id);
    return `<button type="button" class="app pick${on ? ' on' : ''}" style="--c:${esc(a.color || COLORS[0])}" data-pin="${esc(a.id)}" aria-pressed="${on}">
        <span class="ico" aria-hidden="true">${esc(a.icon || '🔗')}</span><span class="tx"><b>${esc(a.name)}</b>${descOf(a) ? `<small>${esc(descOf(a))}</small>` : ''}</span>
        <span class="chk" aria-hidden="true">${on ? ic('check') : ''}</span></button>`; };
  if (editPins && allTiles.length > 4) return `<section class="mine editing"><div class="sec"><h2>${ic('pin')}${T('editMine')}</h2>
      <button type="button" class="btn small primary" data-act="pins-done">${ic('check')}${T('done')}</button><p>${T('editHint')}</p></div>
      <div class="grid">${allTiles.map(pick).join('')}</div></section>`;
  const editBtn = `<button type="button" class="btn small" data-act="pins-edit">${ic('pin')}${T('editMine')}</button>`;
  const rest = tiles.filter(a => !mine.includes(a));
  const head = ql ? T('results') : mine.length ? T('otherApps') : T('allApps');
  const sections = rest.length ? `<section><div class="sec"><h2>${ic(ql ? 'search' : 'globe')}${head}</h2>${allTiles.length > 4 ? `<span class="n">${T('nApps', rest.length)}</span>` : ''}</div>
      <div class="grid">${rest.map(tile).join('')}</div></section>` : '';
  return `
    ${mine.length ? `<section class="mine"><div class="sec"><h2>${ic(pins.length ? 'pin' : 'clock')}${T('mine')}</h2>${editBtn}${pins.length ? '' : `<p>${T('mineHint')}</p>`}</div><div class="grid">${mine.map(tile).join('')}</div></section>`
      : !ql && allTiles.length > 4 ? `<section class="mine"><div class="sec"><h2>${ic('pin')}${T('mine')}</h2>${editBtn}<p>${T('mineEmpty')}</p></div></section>` : ''}
    ${tiles.length ? sections
    : (quick.length ? '' : `<div class="empty">${all.length ? `${T('noMatch')}<br><button class="btn" data-act="clear-q">${ic('x')}${T('clearSearch')}</button>`
        : `${ic('lock')}<h2>${T('noApps')}</h2><p class="who-am">${T('yourUser', esc(me.username))}</p>${contactOf() ? `<p class="who-am">${T('contactLbl')}: <b>${esc(contactOf())}</b></p>` : ''}`}</div>`)}
    ${quick.length || news.length ? `<div class="lower${quick.length && news.length ? '' : ' one'}">
      ${quick.length ? `<section class="panel"><h2>${ic('zap')}${T('quick')}</h2><div class="quick">${quick.map(a => `
        <a href="${esc(a.url)}" target="_blank" rel="noopener" data-app="${esc(a.id)}" ${serverOf(a) === 'factory' ? 'data-plant="1"' : ''} ${SSO_URL && a.sso === 'ticket' ? `data-ticket="${esc(a.id)}"` : ''}><span aria-hidden="true">${esc(a.icon || '🔗')}</span><b>${esc(a.name)}</b><span class="sr"> (${T('newTab')})</span></a>`).join('')}</div></section>` : ''}
      ${news.length ? `<section class="panel"><h2>${ic('megaphone')}${T('news')}</h2><ul class="news">${news.map(n => `<li>${esc(n)}</li>`).join('')}</ul></section>` : ''}
    </div>` : ''}
    ${iosHintHtml()}`;
}

/* ---------------- dialogs ---------------- */
function confirmDlg(msg, okLabel, onOk){ openDlg(`<h3>${esc(msg)}</h3>`, () => { onOk(); }, okLabel, true); }
function openDlg(html, onSubmit, okLabel, danger){
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" id="dlgForm">${html}<div class="err" id="derr" role="alert"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlgCancel">${T('cancel')}</button><button class="btn primary${danger ? ' danger-fill' : ''}">${okLabel || T('save')}</button></div></form>`;
  $('#dlgCancel').onclick = () => d.close();
  linkLabels(d);
  const h = d.querySelector('h3'); if (h){ h.id = 'dlgTitle'; d.setAttribute('aria-labelledby', 'dlgTitle'); } else d.removeAttribute('aria-labelledby');
  $('#dlgForm').onsubmit = async e => {
    e.preventDefault();
    const msg = await onSubmit(e.target);
    if (msg) return $('#derr').textContent = msg;
    d.close(); render();
  };
  d.showModal();
}

function appDlg(i){
  const a = i == null ? {icon:ICONS[cfg.apps.length % ICONS.length], color:COLORS[cfg.apps.length % COLORS.length]} : cfg.apps[i];
  openDlg(`<h3>${i == null ? T('addAppT') : T('editAppT')}</h3>
    <label>${T('appName')}</label><input type="text" name="name" required value="${esc(a.name)}">
    <label>${T('url')}</label><input type="url" name="url" required placeholder="https://…" value="${esc(a.url)}">
    ${(() => { const o = splitDesc(a.desc); return `<label>${T('descTh')}</label><input type="text" name="dth" lang="th" value="${esc(o.th)}">
    <label>${T('descZh')}</label><input type="text" name="dzh" lang="zh-CN" value="${esc(o.zh)}">
    <label>${T('descEn')}</label><input type="text" name="den" lang="en" value="${esc(o.en)}">`; })()}
    <label>${T('serverType')}</label><select name="server">${SERVERS.map(s => `<option value="${s.id}" ${(i == null ? 'external' : serverOf(a)) === s.id ? 'selected' : ''}>${srvLabel(s.id)} — ${srvHint(s.id)}</option>`).join('')}</select>
    <label>${T('position')}</label><select name="kind"><option value="tile">${T('posTile')}</option><option value="quick" ${a.kind==='quick'?'selected':''}>${T('posQuick')}</option></select>
    ${SSO_URL ? `<label>${T('appSso')}</label><select name="sso"><option value="">${T('ssoModeOff')}</option><option value="ticket" ${a.sso==='ticket'?'selected':''}>${T('ssoModeTicket')}</option></select>
    <label>${T('appRoles')}</label><input type="text" name="roles" placeholder="admin, auditor, viewer" value="${esc((a.roles||[]).join(', '))}">` : ''}
    <div class="row"><div><label>${T('icon')}</label><select name="icon">${[...new Set([a.icon, ...ICONS])].filter(Boolean).map(x => `<option ${x===a.icon?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>${T('color')}</label><input type="color" name="color" value="${esc(a.color||COLORS[0])}" style="width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--card)"></div></div>`,
  f => {
    const url = f.url.value.trim();
    if (!/^https?:\/\//i.test(url)) return T('urlErr');
    const desc = joinDesc({th:f.dth.value.trim(), zh:f.dzh.value.trim(), en:f.den.value.trim()});
    if (desc.length > 200) return T('descLong');
    const data = {name:f.name.value.trim(), url, desc, kind:f.kind.value, server:f.server.value, icon:f.icon.value, color:f.color.value};
    if (SSO_URL){ data.sso = f.sso.value; data.roles = f.roles.value.split(',').map(x => x.trim()).filter(Boolean); }
    if (i == null){
      let id = slug(data.name), n = 2;
      while (cfg.apps.some(x => x.id === id)) id = slug(data.name) + '-' + n++;
      cfg.apps.push({id, ...data});
    } else Object.assign(cfg.apps[i], data);
    saveCfg();
  });
  // new app: pick the server type from the URL until the admin chooses one
  if (i == null){
    const f = $('#dlgForm'); let touched = false;
    f.server.onchange = () => touched = true;
    f.url.oninput = () => { if (!touched) f.server.value = guessServer(f.url.value.trim()); };
  }
}

function userDlg(i){
  const u = i == null ? {role:'user'} : cfg.users[i];
  const isNew = i == null;
  openDlg(`<h3>${isNew ? T('addUserT') : T('editUserT')}</h3>
    <label>${T('username')}</label><input type="text" name="u" required value="${esc(u.username)}" ${isNew?'':'readonly'} autocomplete="off">
    <label>${T('displayName')}</label><input type="text" name="n" value="${esc(isNew ? '' : dispName(u))}">
    <label>${T('role')}</label><select name="role"><option value="user" ${u.role!=='admin'?'selected':''}>${T('roleUser')}</option><option value="admin" ${u.role==='admin'?'selected':''}>${T('roleAdmin')}</option></select>
    <label>${isNew ? T('pwMin') : T('pwNew')}</label><input type="password" name="p" ${isNew?'required':''} minlength="6" autocomplete="new-password">`,
  async f => {
    const username = f.u.value.trim(), role = f.role.value;
    if (isNew && cfg.users.some(x => x.username.toLowerCase() === username.toLowerCase())) return T('userExists');
    if (!isNew && u.role === 'admin' && role !== 'admin' && cfg.users.filter(isAdmin).length === 1) return T('needAdmin');
    const cred = !f.p.value ? {} : SSO_URL ? {pw: f.p.value} : await makeCred(f.p.value);
    const name = cleanName(f.n.value) || username;
    if (isNew) cfg.users.push({username, name, role, apps:[], ...cred});
    else Object.assign(u, {name, role, ...cred});
    saveCfg();
  });
}

// every user can edit their own display name / password
function profileDlg(){
  openDlg(`<h3>${T('profile')}</h3>
    <label>${T('usernameRO')}</label><input type="text" value="${esc(me.username)}" readonly>
    <label>${T('displayName')}</label><input type="text" name="n" required maxlength="60" value="${esc(dispName(me))}" autofocus>
    <label>${T('pwNew')}</label><input type="password" name="p" minlength="6" autocomplete="new-password">
    <label>${T('pwNewConfirm')}</label><input type="password" name="p2" autocomplete="new-password">
    ${isAdmin(me) ? '' : `<p class="hint">${T('profileHint')}</p>`}`,
  async f => {
    const name = cleanName(f.n.value);
    if (!name) return T('needName');
    if (f.p.value && f.p.value !== f.p2.value) return T('pwMismatch');
    if (SSO_URL){
      try { const d = await sso('profile', {token: lsGet(LS_SSO), name, password: f.p.value || undefined});
            lsSet(LS_SSO, d.token); me.name = d.user.name; cfg.rev = d.rev; }
      catch (x){ return ssoMsg(x); }
      return;
    }
    const remembered = (() => { try { return JSON.parse(lsGet(LS_REMEMBER))?.u === me.username; } catch { return false; } })();
    Object.assign(me, {name}, f.p.value ? await makeCred(f.p.value) : {});
    if (remembered) rememberLogin(me);
    saveCfg();
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('main a[data-app]');
  if (!a || !EMBED || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const app = cfg.apps.find(x => x.id === a.dataset.app);
  if (!app || !sameSite(app.url)) return;          // other sites (factory servers, JDY…) still open outside
  e.preventDefault(); e.stopImmediatePropagation();
  if (!(SSO_URL && app.sso === 'ticket')) return embedOpen(app);
  sso('ticket', {token: lsGet(LS_SSO), app: app.id})
    .then(d => embedOpen(app, insertParam(app.url, 'sso', d.ticket)))
    .catch(x => { if (x.code === 'AUTH'){ ssoSignOut(); return loadCfg().then(render); } toast(ssoMsg(x)); });
});
// SSO apps: open a tab right away (keeps pop-up blockers happy), then send it to the app with a 2-minute ticket
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-ticket]');
  if (!a || !SSO_URL || e.defaultPrevented) return;
  e.preventDefault();
  const w = window.open('', '_blank');
  if (w) w.document.write(`<body style="margin:0;display:grid;place-items:center;height:100vh;background:#f2f5f9;color:#132238;font:16px 'Segoe UI','Leelawadee UI','Microsoft YaHei',sans-serif">${esc(T('ssoOpening'))}</body>`);
  sso('ticket', {token: lsGet(LS_SSO), app: a.dataset.ticket}).then(d => {
    const url = insertParam(a.href, 'sso', d.ticket);
    if (w) w.location.replace(url); else location.href = url;
  }).catch(x => {
    if (w) w.close();
    if (x.code === 'AUTH'){ ssoSignOut(); return loadCfg().then(render); }
    toast(ssoMsg(x));
  });
});
// remember which apps were opened (capture: runs before the handlers that open apps)
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-app]');
  if (!a || (a.dataset.plant && !plantGo && lsGet('cpsPortal.plantOk') !== '1')) return;     // plant apps count once the user confirms
  addRecent(a.dataset.app);
}, true);
// apps on the plant network: say so before opening (a check from this https page to an http plant server is blocked by the browser)
let plantGo = false;
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-plant]');
  if (!a || plantGo || e.ctrlKey || e.metaKey || e.shiftKey || lsGet('cpsPortal.plantOk') === '1') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const name = a.querySelector('b')?.textContent || '';
  openDlg(`<div class="plant-dlg"><h3>${T('plantT')}</h3><p>${esc(T('plantP', name))}</p>
    <label class="check"><input type="checkbox" name="dont"> ${T('plantDont')}</label></div>`, f => {
      if (f.dont.checked) lsSet('cpsPortal.plantOk', '1');
      plantGo = true; try { a.click(); } finally { plantGo = false; }
    }, T('openApp'));
  $('#dlg .btn.primary')?.focus();
}, true);
// close the account menu on a click outside it
document.addEventListener('click', e => {
  if (menuOpen && !e.target.closest('#menu,[data-act="menu"]')){ menuOpen = false; $('#menu')?.remove(); $('.who')?.setAttribute('aria-expanded', 'false'); }
}, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && menuOpen){ menuOpen = false; render(); $('.who')?.focus(); }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.matches?.('[role="tab"]')){
    const tabsEl = [...document.querySelectorAll('[role="tab"]')], i = tabsEl.indexOf(e.target);
    const n = tabsEl[(i + (e.key === 'ArrowRight' ? 1 : -1) + tabsEl.length) % tabsEl.length];
    tab = n.dataset.tab; render(); $(`[data-tab="${tab}"]`)?.focus(); e.preventDefault(); return;
  }
  if (menuOpen && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('#menu,.who')){      // move through the account menu
    const items = [...document.querySelectorAll('#menu button')], i = items.indexOf(document.activeElement);
    e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus();
  }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-lang],[data-pin]');
  if (!t) return;
  const inMenu = !!t.closest('#menu');
  if (t.dataset.lang){ lang = t.dataset.lang; lsSet(LS_LANG, lang); return render(); }
  if (t.dataset.act === 'menu'){ menuOpen = !menuOpen; render(); if (menuOpen) $('#menu .mi')?.focus(); return; }
  if (inMenu) menuOpen = false;
  if (t.dataset.act === 'sso-reload'){ renderLoading(); return loadCfg().then(render); }
  if (t.dataset.act === 'clear-q'){ q = ''; render(); return $('#q')?.focus(); }
  if (t.dataset.act === 'ios-hint-off'){ lsSet('cpsPortal.iosHint', '0'); return render(); }
  if (t.dataset.pin){
    const id = t.dataset.pin, cur = pinIds();
    if (!cur.includes(id) && cur.length >= 4) return toast(T('pinFull'));
    lsSet(pinKey(), JSON.stringify(cur.includes(id) ? cur.filter(x => x !== id) : [...cur, id]));
    const b = $('#pbody'); if (b) b.innerHTML = portalBody();
    const name = myApps().find(a => a.id === id)?.name || '', st = $('#pinstat');
    if (st) st.textContent = T(cur.includes(id) ? 'unpinned' : 'pinned', name);
    return $(`[data-pin="${CSS.escape(id)}"]`)?.focus();
  }
  if (t.dataset.act === 'pins-edit' || t.dataset.act === 'pins-done'){
    editPins = t.dataset.act === 'pins-edit';
    const b = $('#pbody'); if (b) b.innerHTML = portalBody();
    return (editPins ? $('#pbody [data-pin]') : $('[data-act="pins-edit"]'))?.focus();
  }
  if (t.dataset.act === 'plant-ask'){ lsSet('cpsPortal.plantOk', null); render(); return toast(T('plantAskDone')); }
  if (t.dataset.tab){ tab = t.dataset.tab; return render(); }
  const i = t.dataset.i != null ? +t.dataset.i : null;
  const admin = isAdmin(me);
  switch (t.dataset.act){
    case 'logout': embedApp = null; sessionStorage.removeItem(SS_ME); forgetLogin(); if (SSO_URL) ssoSignOut(); view = 'portal'; return render();
    case 'embed-close': if (history.state && history.state.embed) return history.back(); return embedClose();
    case 'profile': render(); return profileDlg();
    case 'go-portal': view = 'portal'; return render();
    case 'go-settings': if (admin){ view = 'settings'; render(); } return;
  }
  if (!admin) return;
  switch (t.dataset.act){
    case 'app-new': return appDlg(null);
    case 'app-edit': return appDlg(i);
    case 'app-up': case 'app-down': {
      const j = i + (t.dataset.act === 'app-up' ? -1 : 1);
      [cfg.apps[i], cfg.apps[j]] = [cfg.apps[j], cfg.apps[i]]; saveCfg(); return render();
    }
    case 'app-del':
      return confirmDlg(T('confirmDelApp', cfg.apps[i].name), T('del'), () => {
        const id = cfg.apps[i].id; cfg.apps.splice(i,1); cfg.users.forEach(u => u.apps = (u.apps||[]).filter(x => x !== id)); saveCfg(); });
    case 'user-new': return userDlg(null);
    case 'user-edit': return userDlg(i);
    case 'user-del':
      if (cfg.users[i].username === me.username) return;
      return confirmDlg(T('confirmDelUser', cfg.users[i].username), T('del'), () => { cfg.users.splice(i,1); saveCfg(); });
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'}));
      a.download = SSO_URL ? 'cps-portal-backup.json' : 'config.json'; a.click(); URL.revokeObjectURL(a.href); return;
    }
    case 'import': return $('#importFile').click();
    case 'gh-publish': return ghPublish();
    case 'sso-save': return ssoSave();
    case 'gh-disconnect': lsSet(LS_GHTOKEN, null); ghState = {status:'idle'}; return render();
    case 'reset-local':
      return confirmDlg(T('confirmReset'), T('resetLocal'), () => { localStorage.removeItem(LS_CFG); sessionStorage.removeItem(SS_ME); loadCfg().then(render); });
  }
});
// permission matrix: update the row in place, so focus and scroll position stay where the admin is working
function syncMatrixRow(u){
  const has = new Set(u.apps || []);
  document.querySelectorAll(`[data-perm^="${CSS.escape(u.username)}|"]`).forEach(c => { c.checked = isAdmin(u) || has.has(c.dataset.perm.split('|')[1]); });
  const all = document.querySelector(`[data-permall="${CSS.escape(u.username)}"]`);
  if (all) all.checked = isAdmin(u) || cfg.apps.every(a => has.has(a.id));
  showGh();
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'contactBox' && isAdmin(me)){ cfg.contact = t.value.replace(/\s+/g, ' ').trim(); lsSet(LS_CONTACT, cfg.contact || null); saveCfg(); showGh(); return; }
  if (t.matches('[data-langsel]')){ lang = t.value; lsSet(LS_LANG, lang); return render(); }
  if (t.id === 'importFile' && t.files[0] && isAdmin(me)){
    t.files[0].text().then(txt => {
      let c; try { c = JSON.parse(txt); } catch {}
      if (!validCfg(c) || !c.users.some(isAdmin)) return toast(T('badFile'));
      cfg = c; saveCfg(); render();
    });
    return;
  }
  if (!isAdmin(me)) return;
  if (t.id === 'newsBox'){
    cfg.news = t.value.split('\n').map(s => s.trim()).filter(Boolean); saveCfg(); return render();
  }
  if (t.dataset.role){
    const [un, id] = t.dataset.role.split('|');
    const u = cfg.users.find(x => x.username === un); if (!u) return;
    const s = new Set(u.apps || []); u.roles = u.roles || {};
    if (t.value){ s.add(id); u.roles[id] = t.value; } else { s.delete(id); delete u.roles[id]; }
    u.apps = [...s]; saveCfg(); return render();
  }
  if (t.dataset.perm){
    const [un, id] = t.dataset.perm.split('|');
    const u = cfg.users.find(x => x.username === un); if (!u) return;
    const s = new Set(u.apps || []); t.checked ? s.add(id) : s.delete(id);
    u.apps = [...s]; saveCfg(); syncMatrixRow(u);
  } else if (t.dataset.permall){
    const u = cfg.users.find(x => x.username === t.dataset.permall); if (!u) return;
    u.apps = t.checked ? cfg.apps.map(a => a.id) : []; saveCfg(); syncMatrixRow(u);
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  q = e.target.value;                         // redraw only the results, so typing never loses focus
  const b = $('#pbody'); if (b) b.innerHTML = portalBody();
  const c = $('.search [data-act="clear-q"]'); if (c) c.hidden = !q;
  const st = $('#qstat'); if (st) st.textContent = q ? T('nResults', document.querySelectorAll('#pbody a[data-app]').length) : '';
});

/* ---------------- install as app (PWA) ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
const installBtn = document.createElement('button');
installBtn.className = 'btn primary install-btn';
installBtn.innerHTML = '<img src="favicon.png" alt=""> ';
installBtn.appendChild(document.createTextNode(' ' + T('install')));
installBtn.hidden = true;
document.body.appendChild(installBtn);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; installBtn.hidden = true; });
installBtn.onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; installBtn.hidden = true;
};

document.addEventListener('submit', async e => {
  if (e.target.id !== 'ghForm' || !isAdmin(me)) return;
  e.preventDefault();
  const token = e.target.t.value.trim(), err = $('#ghErr'), btn = e.target.querySelector('button');
  btn.disabled = true; err.textContent = T('ghChecking');
  try {
    await ghConnect(token);
    render();
    if (unpublished()) ghPublish();
  } catch (x){ err.textContent = ghErrText(x); btn.disabled = false; }
});

renderLoading();
loadCfg().then(render);
</script>
