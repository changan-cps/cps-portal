<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPS Digital Platform</title>
<link rel="icon" type="image/png" sizes="48x48" href="favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CPS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b469f">
<style>
:root{
  color-scheme:dark;
  --bg:#06132b; --card:#0e2247; --ink:#eaf1ff; --muted:#93a6c8; --line:#22407a;
  --brand:#3b9bff; --brand-ink:#04122b; --danger:#ff8080; --ok:#5fd093; --warn-bg:#3a2f10; --warn-ink:#f5d27a;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 80% -10%,#12408f 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 "Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 10px;font-size:13px}
input[type=text],input[type=password],input[type=url],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
input:focus,select:focus,.btn:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
label.check{display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink);font-size:14px;cursor:pointer}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:8px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.auth h1{margin:0 0 4px;font-size:22px}
.auth p{margin:0 0 8px;color:var(--muted);font-size:14px}
.auth .btn{width:100%;margin-top:18px}

/* layout */
header{background:linear-gradient(115deg,#082a6b 0%,#0b469f 50%,#2a86e0 100%);border-bottom:1px solid var(--line);padding:22px 0 18px}
header .in{max-width:1100px;margin:0 auto;padding:0 16px}
header .top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .logo{margin-right:auto;display:flex;align-items:center;gap:14px}
header .logo img{width:clamp(48px,7vw,68px);height:auto;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.auth .appicon{display:block;width:120px;height:120px;margin:0 auto 14px;border-radius:26px;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.auth h1,.auth p{text-align:center}
header h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.15;letter-spacing:.3px}
header .sub{font-size:clamp(14px,2vw,18px);opacity:.9}
header .tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header .tools input{width:200px;border-radius:99px;background:rgba(4,18,43,.45);border-color:rgba(255,255,255,.25)}
header .btn{background:rgba(4,18,43,.45);border-color:rgba(255,255,255,.25)}
header .who{display:flex;align-items:center;gap:8px;font-size:13px}
header button.who{background:none;border:1px solid transparent;border-radius:99px;padding:3px 10px 3px 3px;cursor:pointer;color:inherit}
header button.who:hover{border-color:rgba(255,255,255,.4);background:rgba(4,18,43,.3)}
header .avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b469f;font-weight:700}
.flow{display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:16px;font-size:14px}
.flow span{display:flex;align-items:center;gap:6px}
.flow span+span::before{content:"›";opacity:.6;margin-right:8px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner span{flex:1;min-width:220px}

/* portal */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar h2{margin:0;font-size:18px;margin-right:auto}
.toolbar input{max-width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:128px;text-align:center;
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:14px 10px;
  text-decoration:none;color:#fff;box-shadow:var(--shadow);transition:transform .12s,filter .12s}
.app:hover{transform:translateY(-3px);filter:brightness(1.12)}
.app .ico{font-size:36px;line-height:1}
.app b{display:block;font-size:15px;line-height:1.3}
.app small{display:block;font-size:12px;opacity:.85}
.mini{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;font-size:18px;background:var(--c)}
.tag.srv{color:var(--s);border-color:var(--s);white-space:nowrap}
.sec{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sec:first-child{margin-top:0}
.sec h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--s)}
.sec small{color:var(--muted)}
.sec .n{margin-left:auto;color:var(--muted);font-size:13px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);padding:5px 14px;border-radius:99px;cursor:pointer}
.filters button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600}
.lower{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:720px){.lower{grid-template-columns:1fr}}
.lower h3{margin:0 0 12px;font-size:16px}
.quick{display:flex;gap:10px;flex-wrap:wrap}
.quick a{display:flex;flex-direction:column;align-items:center;gap:4px;width:86px;padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;text-align:center;text-decoration:none;color:inherit}
.quick a:hover{border-color:var(--brand)}
.quick a span{font-size:22px}
.news{list-style:none;margin:0;padding:0}
.news li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.news li:last-child{border:0}
.news li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--d)}
.install-btn{position:fixed;right:16px;bottom:16px;z-index:20;display:flex;align-items:center;gap:8px;border-radius:99px;padding:8px 16px 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.install-btn[hidden]{display:none}
.install-btn img{width:28px;height:28px;border-radius:7px}
textarea{width:100%;min-height:160px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:inherit;font:inherit}
.empty{text-align:center;color:var(--muted);padding:50px 10px}

/* settings */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.c,th.c{text-align:center}
td.act{white-space:nowrap;text-align:right}
td .url{color:var(--muted);font-size:13px;word-break:break-all}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.admin{color:var(--brand);border-color:var(--brand)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--brand);cursor:pointer}
.matrix th.app-col{font-weight:600;color:var(--ink);min-width:90px;text-align:center}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px;width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 4px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>

<script>
/* =========================================================
   CPS App Portal — หน้าเดียวจบ ไม่ต้องมี server
   ข้อมูล (แอป / ผู้ใช้ / สิทธิ์) เก็บใน config.json ข้างไฟล์นี้
   และ localStorage ของเบราว์เซอร์ (ฉบับที่แก้ล่าสุดจะถูกใช้)
   ========================================================= */
const LS_CFG = 'cpsPortal.cfg', SS_ME = 'cpsPortal.me';
const LS_REMEMBER = 'cpsPortal.remember', LS_LASTUSER = 'cpsPortal.lastUser';

/* --- จดจำการเข้าสู่ระบบในเครื่องนี้ ---
   ไม่ได้เก็บรหัสผ่าน: เก็บแค่ชื่อผู้ใช้ + hash ปัจจุบันของผู้ใช้นั้น
   ถ้า Admin รีเซ็ตรหัส / ลบผู้ใช้ hash จะไม่ตรง -> ต้อง login ใหม่อัตโนมัติ */
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };
function rememberLogin(u){ lsSet(LS_REMEMBER, JSON.stringify({u: u.username, h: u.hash})); }
function forgetLogin(){ lsSet(LS_REMEMBER, null); }
function currentUserName(){
  const s = sessionStorage.getItem(SS_ME);
  if (s) return s;
  let r = null; try { r = JSON.parse(lsGet(LS_REMEMBER)); } catch {}
  const u = r && cfg.users.find(x => x.username === r.u && x.hash === r.h);
  if (!u){ if (r) forgetLogin(); return null; }
  sessionStorage.setItem(SS_ME, u.username);
  return u.username;
}
const DEFAULT_APPS = [
  {id:'lean-quest',       name:'Lean Quest',          url:'https://changan-cps.github.io/lean-quest/',                 desc:'เกม/กิจกรรม Lean', icon:'🎯', color:'#0b5cad'},
  {id:'lean-quest-admin', name:'Lean Quest (Admin)',  url:'https://changan-cps.github.io/lean-quest/index.html#admin', desc:'หน้าจัดการ Lean Quest', icon:'🛠️', color:'#6b4bc4'},
  {id:'local-8090',       name:'Local App (8090)',    url:'http://localhost:8090/',                                    desc:'แอปที่รันบนเครื่อง', icon:'💻', color:'#3d7a5a'},
  {id:'cps-pjo-audit',    name:'CPS PJO Audit',       url:'https://changan-cps.github.io/cps-pjo-audit/',              desc:'ระบบตรวจ PJO', icon:'📋', color:'#c2571a'},
];
const ICONS = ['🎯','🛠️','💻','📋','📊','📈','🏭','🚗','🔧','📦','🧾','✅','📝','🎓','🗂️','📅','🔍','⚙️','🏆','📷'];
const COLORS = ['#0b5cad','#6b4bc4','#3d7a5a','#c2571a','#b0305c','#2a7f8f','#8a6d1a','#4a5568'];
// ประเภท Server ของแอป
const SERVERS = [
  {id:'external', label:'External Server', icon:'🌐', hint:'เปิดได้ทุกที่ผ่านอินเทอร์เน็ต', color:'#3b9bff'},
  {id:'factory',  label:'Factory Server',  icon:'🏭', hint:'เปิดได้เฉพาะในเครือข่ายโรงงาน', color:'#5fd093'},
];
// เดาประเภทจาก URL: localhost / IP ภายใน / ชื่อเครื่องในวง LAN = Factory, นอกนั้น = External
function guessServer(url){
  let h = ''; try { h = new URL(url).hostname; } catch { return 'external'; }
  if (h === 'localhost' || h.endsWith('.local') || h.endsWith('.lan') || !h.includes('.')) return 'factory';
  if (/^(127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(h)) return 'factory';
  return 'external';
}
const serverOf = a => SERVERS.some(s => s.id === a.server) ? a.server : guessServer(a.url);
const serverInfo = a => SERVERS.find(s => s.id === serverOf(a));
const serverTag = a => { const s = serverInfo(a); return `<span class="tag srv" style="--s:${s.color}">${s.icon} ${s.label}</span>`; };

let cfg = null;          // {apps:[], users:[], updatedAt}
let remoteAt = 0;        // updatedAt ของ config.json บนเว็บ
let me = null;           // user object ที่ login อยู่
let view = 'portal';     // portal | settings
let tab = 'perm';        // perm | apps | users | publish
let q = '';
let srvFilter = 'all';   // all | external | factory

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x,16)));
// ตัดอักขระที่มองไม่เห็น และสัญลักษณ์แปลก ๆ ที่หลุดมาหน้า/ท้ายชื่อ
const cleanName = s => String(s ?? '').replace(/[\p{C}]/gu, '').replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}.)]+$/gu, '').replace(/\s+/g, ' ').trim();
const dispName = u => cleanName(u?.name) || u?.username || '';
const initial = u => (dispName(u).match(/[\p{L}\p{N}]/u)?.[0] || '?').toUpperCase();
const slug = s => (s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'app') ;

async function hashPw(pw, saltHex){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:unhex(saltHex), iterations:150000}, key, 256);
  return hex(bits);
}
async function makeCred(pw){
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  return {salt, hash: await hashPw(pw, salt)};
}
const validCfg = c => c && Array.isArray(c.apps) && Array.isArray(c.users);

async function loadCfg(){
  let local = null, remote = null;
  try { local = JSON.parse(localStorage.getItem(LS_CFG)); } catch {}
  try {
    const r = await fetch('config.json?_=' + Date.now(), {cache:'no-store'});
    if (r.ok) remote = await r.json();
  } catch {}
  if (!validCfg(local)) local = null;
  if (!validCfg(remote)) remote = null;
  remoteAt = remote?.updatedAt || 0;
  cfg = (local && remote) ? ((local.updatedAt||0) >= remoteAt ? local : remote)
      : (local || remote || {apps: structuredClone(DEFAULT_APPS), users: [], updatedAt: 0});
}
function saveCfg(){
  cfg.updatedAt = Date.now();
  try { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); } catch {}
}
const isAdmin = u => u?.role === 'admin';
const myApps = () => cfg.apps.filter(a => isAdmin(me) || (me.apps||[]).includes(a.id));
const unpublished = () => cfg.users.length && (cfg.updatedAt||0) > remoteAt;

/* ---------------- render ---------------- */
function render(){
  const name = currentUserName();
  me = cfg.users.find(u => u.username === name) || null;
  if (!cfg.users.length) return renderSetup();
  if (!me) return renderLogin();
  if (view === 'settings' && !isAdmin(me)) view = 'portal';
  $('#root').innerHTML = `
    <header><div class="in">
      <div class="top">
        <div class="logo"><img src="icon.webp" alt=""><div><h1>CPS Digital Platform</h1><div class="sub">Changan Production System</div></div></div>
        <div class="tools">
          ${view === 'portal' ? `<input type="text" id="q" placeholder="🔍 Search…" value="${esc(q)}" aria-label="ค้นหาแอป">` : ''}
          ${isAdmin(me) ? (view === 'settings'
              ? `<button class="btn" data-act="go-portal">← กลับหน้าเมนู</button>`
              : `<button class="btn" data-act="go-settings">⚙️ ตั้งค่า Permission</button>`) : ''}
          <button class="who" data-act="profile" title="แก้ไขชื่อที่แสดง / รหัสผ่าน"><span class="avatar">${esc(initial(me))}</span>${esc(dispName(me))} ✏️</button>
          <button class="btn" data-act="logout">ออกจากระบบ</button>
        </div>
      </div>
      <div class="flow"><span>📅 Plan</span><span>📄 Standard</span><span>📊 Analyze</span><span>📈 Improve</span><span>✅ Follow up</span></div>
    </div></header>
    <main>${view === 'settings' ? settingsHtml() : (isAdmin(me) && unpublished()
      ? `<div class="banner"><span>⚠️ เครื่องนี้มีการแก้ไขที่ยังไม่ได้เผยแพร่ — มือถือ/เครื่องอื่นจะยังเห็นแอปและสิทธิ์ชุดเดิม จนกว่าจะอัปโหลด <b>config.json</b> ขึ้น GitHub</span>
         <button class="btn small" data-act="export">⬇️ ดาวน์โหลด config.json</button></div>` : '') + portalHtml()}</main>`;
}

function renderSetup(){
  $('#root').innerHTML = `<div class="auth"><form class="box" id="setupForm">
    <img class="appicon" src="icon.webp" alt="CPS Digital Platform">
    <h1>ตั้งค่าครั้งแรก</h1>
    <p>ยังไม่มีผู้ใช้ในระบบ — สร้างบัญชีผู้ดูแล (Admin) ก่อน</p>
    <label>ชื่อผู้ใช้</label><input type="text" name="u" required autocomplete="username" autofocus>
    <label>ชื่อที่แสดง</label><input type="text" name="n">
    <label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input type="password" name="p" required minlength="6" autocomplete="new-password">
    <label>ยืนยันรหัสผ่าน</label><input type="password" name="p2" required autocomplete="new-password">
    <div class="err" id="err"></div>
    <button class="btn primary">สร้างบัญชี Admin</button>
  </form></div>`;
  $('#setupForm').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, u = f.u.value.trim();
    if (f.p.value !== f.p2.value) return $('#err').textContent = 'รหัสผ่านไม่ตรงกัน';
    cfg.users.push({username:u, name:cleanName(f.n.value) || u, role:'admin', apps:[], ...(await makeCred(f.p.value))});
    saveCfg(); sessionStorage.setItem(SS_ME, u); view = 'settings'; tab = 'users'; render();
  };
}

function renderLogin(){
  $('#root').innerHTML = `<div class="auth"><form class="box" id="loginForm">
    <img class="appicon" src="icon.webp" alt="CPS Digital Platform">
    <h1>CPS Digital Platform</h1>
    <p>เข้าสู่ระบบเพื่อดูแอปที่คุณมีสิทธิ์ใช้งาน</p>
    <label>ชื่อผู้ใช้</label><input type="text" name="u" required autocomplete="username" value="${esc(lsGet(LS_LASTUSER) || '')}">
    <label>รหัสผ่าน</label><input type="password" name="p" required autocomplete="current-password">
    <label class="check"><input type="checkbox" name="r" checked> จดจำการเข้าสู่ระบบในเครื่องนี้</label>
    <div class="err" id="err"></div>
    <button class="btn primary">เข้าสู่ระบบ</button>
  </form></div>`;
  const lf = $('#loginForm');
  (lf.u.value ? lf.p : lf.u).focus();
  lf.onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    const u = cfg.users.find(x => x.username.toLowerCase() === f.u.value.trim().toLowerCase());
    if (!u || (await hashPw(f.p.value, u.salt)) !== u.hash) return $('#err').textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    lsSet(LS_LASTUSER, u.username);
    f.r.checked ? rememberLogin(u) : forgetLogin();
    sessionStorage.setItem(SS_ME, u.username); view = 'portal'; q = ''; render();
  };
}

function portalHtml(){
  const all = myApps();
  const list = all.filter(a => !q || (a.name + ' ' + (a.desc||'') + ' ' + a.url).toLowerCase().includes(q.toLowerCase()));
  const allTiles = all.filter(a => a.kind !== 'quick');
  const usedSrv = SERVERS.filter(s => allTiles.some(a => serverOf(a) === s.id));
  if (!usedSrv.some(s => s.id === srvFilter)) srvFilter = 'all';
  const tiles = list.filter(a => a.kind !== 'quick' && (srvFilter === 'all' || serverOf(a) === srvFilter));
  const quick = list.filter(a => a.kind === 'quick');
  const news = cfg.news || [], dots = ['#3b9bff','#f5b83d','#5fd093','#ff8080'];
  const tile = a => `
      <a class="app" style="--c:${esc(a.color || COLORS[0])}" href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.url)}">
        <span class="ico">${esc(a.icon || '🔗')}</span>
        <span><b>${esc(a.name)}</b>${a.desc ? `<small>${esc(a.desc)}</small>` : ''}</span>
      </a>`;
  const sections = SERVERS.map(s => {
    const items = tiles.filter(a => serverOf(a) === s.id);
    return items.length ? `<div class="sec" style="--s:${s.color}"><h2>${s.icon} ${s.label}</h2><small>${s.hint}</small><span class="n">${items.length} แอป</span></div>
      <div class="grid">${items.map(tile).join('')}</div>` : '';
  }).join('');
  return `
    ${usedSrv.length > 1 ? `<div class="filters">${[{id:'all', icon:'', label:'ทั้งหมด'}, ...usedSrv].map(s =>
      `<button class="${srvFilter === s.id ? 'on' : ''}" data-srv="${s.id}">${s.icon} ${s.label}</button>`).join('')}</div>` : ''}
    ${tiles.length ? sections
    : (quick.length ? '' : `<div class="empty">${all.length ? 'ไม่พบแอปที่ค้นหา' : 'คุณยังไม่ได้รับสิทธิ์ใช้งานแอปใด ๆ<br>กรุณาติดต่อผู้ดูแลระบบ'}</div>`)}
    ${quick.length || news.length ? `<div class="lower">
      ${quick.length ? `<section class="panel"><h3>⚡ Quick Access</h3><div class="quick">${quick.map(a => `
        <a href="${esc(a.url)}" target="_blank" rel="noopener" title="${esc(a.desc || a.url)}"><span>${esc(a.icon || '🔗')}</span>${esc(a.name)}</a>`).join('')}</div></section>` : ''}
      ${news.length ? `<section class="panel"><h3>📣 Announcement</h3><ul class="news">${news.map((n,i) => `<li style="--d:${dots[i % dots.length]}">${esc(n)}</li>`).join('')}</ul></section>` : ''}
    </div>` : ''}`;
}

function settingsHtml(){
  const tabs = [['perm','🔐 สิทธิ์ (Permission)'],['apps','🧩 แอป / ลิงก์'],['users','👤 ผู้ใช้'],['news','📣 ประกาศ'],['publish','☁️ เผยแพร่ / สำรอง']];
  return `
    ${unpublished() ? `<div class="banner"><span>⚠️ มีการแก้ไขที่ยังอยู่แค่ในเบราว์เซอร์นี้ — ต้องดาวน์โหลด <b>config.json</b> แล้วอัปโหลดขึ้นเว็บ ผู้ใช้เครื่องอื่นจึงจะเห็น</span>
      <button class="btn small" data-act="export">⬇️ ดาวน์โหลด config.json</button></div>` : ''}
    <div class="tabs">${tabs.map(([k,l]) => `<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('')}</div>
    <div class="panel">${({perm:permHtml, apps:appsHtml, users:usersHtml, news:newsHtml, publish:publishHtml})[tab]()}</div>`;
}

function newsHtml(){
  return `<h3 style="margin-top:0">ประกาศ (Announcement)</h3>
  <textarea id="newsBox" placeholder="พิมพ์ประกาศ บรรทัดละ 1 เรื่อง">${esc((cfg.news||[]).join('\n'))}</textarea>
  <p class="hint">บรรทัดละ 1 ประกาศ — บันทึกอัตโนมัติเมื่อคลิกออกจากช่อง · ผู้ใช้ทุกคนเห็นประกาศเหมือนกัน</p>`;
}

function permHtml(){
  if (!cfg.apps.length) return `<div class="empty">ยังไม่มีแอป — เพิ่มที่แท็บ "แอป / ลิงก์"</div>`;
  return `<div class="scroll"><table class="matrix">
    <tr><th>ผู้ใช้</th>${cfg.apps.map(a => `<th class="app-col">${esc(a.icon||'')}<br>${esc(a.name)}<br><span title="${serverInfo(a).label}">${serverInfo(a).icon}</span></th>`).join('')}<th class="c">ทั้งหมด</th></tr>
    ${cfg.users.map(u => { const adm = isAdmin(u); const all = adm || cfg.apps.every(a => (u.apps||[]).includes(a.id)); return `
      <tr><td><b>${esc(dispName(u))}</b> ${adm?'<span class="tag admin">Admin</span>':''}<div class="url">${esc(u.username)}</div></td>
      ${cfg.apps.map(a => `<td class="c"><input type="checkbox" data-perm="${esc(u.username)}|${esc(a.id)}" ${adm||(u.apps||[]).includes(a.id)?'checked':''} ${adm?'disabled':''} aria-label="${esc(u.username)} – ${esc(a.name)}"></td>`).join('')}
      <td class="c"><input type="checkbox" data-permall="${esc(u.username)}" ${all?'checked':''} ${adm?'disabled':''} aria-label="ทั้งหมด"></td></tr>`; }).join('')}
  </table></div>
  <p class="hint">ติ๊กเพื่อให้สิทธิ์ — บันทึกทันที · Admin เห็นทุกแอปเสมอ</p>`;
}

function appsHtml(){
  return `<div class="toolbar"><h2>แอป / ลิงก์ (${cfg.apps.length})</h2><button class="btn primary" data-act="app-new">+ เพิ่มแอป</button></div>
  <div class="scroll"><table>
    <tr><th></th><th>ชื่อ</th><th>ประเภท Server</th><th>ลิงก์</th><th></th></tr>
    ${cfg.apps.map((a,i) => `<tr>
      <td><span class="mini" style="--c:${esc(a.color||COLORS[0])}">${esc(a.icon||'🔗')}</span></td>
      <td><b>${esc(a.name)}</b> ${a.kind==='quick'?'<span class="tag">Quick Access</span>':''}<div class="url">${esc(a.desc||'')}</div></td>
      <td>${serverTag(a)}</td>
      <td><a class="url" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.url)}</a></td>
      <td class="act">
        <button class="btn small" data-act="app-up" data-i="${i}" ${i===0?'disabled':''} title="เลื่อนขึ้น">↑</button>
        <button class="btn small" data-act="app-down" data-i="${i}" ${i===cfg.apps.length-1?'disabled':''} title="เลื่อนลง">↓</button>
        <button class="btn small" data-act="app-edit" data-i="${i}">แก้ไข</button>
        <button class="btn small danger" data-act="app-del" data-i="${i}">ลบ</button></td></tr>`).join('')}
  </table></div>`;
}

function usersHtml(){
  return `<div class="toolbar"><h2>ผู้ใช้ (${cfg.users.length})</h2><button class="btn primary" data-act="user-new">+ เพิ่มผู้ใช้</button></div>
  <div class="scroll"><table>
    <tr><th>ชื่อผู้ใช้</th><th>ชื่อที่แสดง</th><th>ระดับ</th><th class="c">จำนวนแอป</th><th></th></tr>
    ${cfg.users.map((u,i) => `<tr>
      <td><b>${esc(u.username)}</b></td><td>${esc(dispName(u))}</td>
      <td><span class="tag ${isAdmin(u)?'admin':''}">${isAdmin(u)?'Admin':'User'}</span></td>
      <td class="c">${isAdmin(u) ? 'ทั้งหมด' : (u.apps||[]).filter(id => cfg.apps.some(a => a.id===id)).length}</td>
      <td class="act"><button class="btn small" data-act="user-edit" data-i="${i}">แก้ไข / รีเซ็ตรหัส</button>
        <button class="btn small danger" data-act="user-del" data-i="${i}" ${u.username===me.username?'disabled':''}>ลบ</button></td></tr>`).join('')}
  </table></div>`;
}

function publishHtml(){
  return `<h3 style="margin-top:0">เผยแพร่ให้ทุกเครื่องเห็น</h3>
  <ol style="padding-left:20px;margin:0 0 14px">
    <li>กด <b>ดาวน์โหลด config.json</b></li>
    <li>อัปโหลดไฟล์ไปไว้โฟลเดอร์เดียวกับ <code>index.html</code> ของ Portal บน GitHub (ทับไฟล์เดิม)</li>
    <li>รอ GitHub Pages อัปเดต ~1 นาที ผู้ใช้ทุกคนจะได้รายการแอปและสิทธิ์ชุดใหม่</li>
  </ol>
  <div class="row" style="flex-wrap:wrap">
    <button class="btn primary" data-act="export">⬇️ ดาวน์โหลด config.json</button>
    <button class="btn" data-act="import">⬆️ นำเข้า config.json</button>
    <button class="btn danger" data-act="reset-local">ล้างข้อมูลในเบราว์เซอร์นี้</button>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <p class="hint">รหัสผ่านถูกเก็บแบบเข้ารหัสทางเดียว (PBKDF2) ในไฟล์ ไม่ได้เก็บเป็นข้อความตรง ๆ<br>
  หมายเหตุ: Portal นี้ควบคุม "เมนูที่มองเห็น" เท่านั้น — ใครรู้ลิงก์ของแอปโดยตรงยังเปิดได้ ถ้าต้องการกันจริง ต้องมี login ในแต่ละแอปด้วย</p>`;

/* ---------------- dialogs ---------------- */
function openDlg(html, onSubmit){
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" id="dlgForm">${html}<div class="err" id="derr"></div>
    <div class="dlg-actions"><button type="button" class="btn" id="dlgCancel">ยกเลิก</button><button class="btn primary">บันทึก</button></div></form>`;
  $('#dlgCancel').onclick = () => d.close();
  $('#dlgForm').onsubmit = async e => {
    e.preventDefault();
    const msg = await onSubmit(e.target);
    if (msg) return $('#derr').textContent = msg;
    d.close(); render();
  };
  d.showModal();
}

function appDlg(i){
  const a = i == null ? {icon:ICONS[cfg.apps.length % ICONS.length], color:COLORS[cfg.apps.length % COLORS.length]} : cfg.apps[i];
  openDlg(`<h3>${i == null ? 'เพิ่มแอป' : 'แก้ไขแอป'}</h3>
    <label>ชื่อแอป</label><input type="text" name="name" required value="${esc(a.name)}">
    <label>ลิงก์ (URL)</label><input type="url" name="url" required placeholder="https://…" value="${esc(a.url)}">
    <label>คำอธิบาย</label><input type="text" name="desc" value="${esc(a.desc)}">
    <label>ประเภท Server</label><select name="server">${SERVERS.map(s => `<option value="${s.id}" ${(i == null ? 'external' : serverOf(a)) === s.id ? 'selected' : ''}>${s.icon} ${s.label} — ${s.hint}</option>`).join('')}</select>
    <label>ตำแหน่งที่แสดง</label><select name="kind"><option value="tile">ไทล์หลัก</option><option value="quick" ${a.kind==='quick'?'selected':''}>Quick Access (ไอคอนเล็กด้านล่าง)</option></select>
    <div class="row"><div><label>ไอคอน</label><select name="icon">${[...new Set([a.icon, ...ICONS])].filter(Boolean).map(x => `<option ${x===a.icon?'selected':''}>${x}</option>`).join('')}</select></div>
    <div><label>สี</label><input type="color" name="color" value="${esc(a.color||COLORS[0])}" style="width:100%;height:40px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--card)"></div></div>`,
  f => {
    const url = f.url.value.trim();
    if (!/^https?:\/\//i.test(url)) return 'ลิงก์ต้องขึ้นต้นด้วย http:// หรือ https://';
    const data = {name:f.name.value.trim(), url, desc:f.desc.value.trim(), kind:f.kind.value, server:f.server.value, icon:f.icon.value, color:f.color.value};
    if (i == null){
      let id = slug(data.name), n = 2;
      while (cfg.apps.some(x => x.id === id)) id = slug(data.name) + '-' + n++;
      cfg.apps.push({id, ...data});
    } else Object.assign(cfg.apps[i], data);
    saveCfg();
  });
  // แอปใหม่: เลือกประเภท Server ให้อัตโนมัติจาก URL จนกว่าจะเลือกเอง
  if (i == null){
    const f = $('#dlgForm'); let touched = false;
    f.server.onchange = () => touched = true;
    f.url.oninput = () => { if (!touched) f.server.value = guessServer(f.url.value.trim()); };
  }
}

function userDlg(i){
  const u = i == null ? {role:'user'} : cfg.users[i];
  const isNew = i == null;
  openDlg(`<h3>${isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้'}</h3>
    <label>ชื่อผู้ใช้</label><input type="text" name="u" required value="${esc(u.username)}" ${isNew?'':'readonly'} autocomplete="off">
    <label>ชื่อที่แสดง</label><input type="text" name="n" value="${esc(isNew ? '' : dispName(u))}">
    <label>ระดับ</label><select name="role"><option value="user" ${u.role!=='admin'?'selected':''}>User — เห็นเฉพาะแอปที่ได้รับสิทธิ์</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin — เห็นทุกแอป + ตั้งค่าได้</option></select>
    <label>${isNew ? 'รหัสผ่าน (อย่างน้อย 6 ตัว)' : 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)'}</label><input type="password" name="p" ${isNew?'required':''} minlength="6" autocomplete="new-password">`,
  async f => {
    const username = f.u.value.trim(), role = f.role.value;
    if (isNew && cfg.users.some(x => x.username.toLowerCase() === username.toLowerCase())) return 'มีชื่อผู้ใช้นี้อยู่แล้ว';
    if (!isNew && u.role === 'admin' && role !== 'admin' && cfg.users.filter(isAdmin).length === 1) return 'ต้องมี Admin อย่างน้อย 1 คน';
    const cred = f.p.value ? await makeCred(f.p.value) : {};
    const name = cleanName(f.n.value) || username;
    if (isNew) cfg.users.push({username, name, role, apps:[], ...cred});
    else Object.assign(u, {name, role, ...cred});
    saveCfg();
  });
}

// ผู้ใช้ทุกคนแก้ชื่อที่แสดง / รหัสผ่านของตัวเองได้
function profileDlg(){
  openDlg(`<h3>โปรไฟล์ของฉัน</h3>
    <label>ชื่อผู้ใช้ (ใช้ login — แก้ไม่ได้)</label><input type="text" value="${esc(me.username)}" readonly>
    <label>ชื่อที่แสดง</label><input type="text" name="n" required maxlength="60" value="${esc(dispName(me))}" autofocus>
    <label>รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)</label><input type="password" name="p" minlength="6" autocomplete="new-password">
    <label>ยืนยันรหัสผ่านใหม่</label><input type="password" name="p2" autocomplete="new-password">
    ${isAdmin(me) ? '' : '<p class="hint">ถ้าใช้หลายเครื่อง แจ้ง Admin ให้อัปเดต config.json ด้วย ไม่งั้นเครื่องอื่นจะยังเห็นชื่อเดิม</p>'}`,
  async f => {
    const name = cleanName(f.n.value);
    if (!name) return 'กรุณาใส่ชื่อที่แสดง';
    if (f.p.value && f.p.value !== f.p2.value) return 'รหัสผ่านไม่ตรงกัน';
    const remembered = (() => { try { return JSON.parse(lsGet(LS_REMEMBER))?.u === me.username; } catch { return false; } })();
    Object.assign(me, {name}, f.p.value ? await makeCred(f.p.value) : {});
    if (remembered) rememberLogin(me);
    saveCfg();
  });
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-srv]');
  if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; return render(); }
  if (t.dataset.srv){ srvFilter = t.dataset.srv; return render(); }
  const i = t.dataset.i != null ? +t.dataset.i : null;
  const admin = isAdmin(me);
  switch (t.dataset.act){
    case 'logout': sessionStorage.removeItem(SS_ME); forgetLogin(); view = 'portal'; return render();
    case 'profile': return profileDlg();
    case 'go-portal': view = 'portal'; return render();
    case 'go-settings': if (admin){ view = 'settings'; render(); } return;
  }
  if (!admin) return;
  switch (t.dataset.act){
    case 'app-new': return appDlg(null);
    case 'app-edit': return appDlg(i);
    case 'app-up': case 'app-down': {
      const j = i + (t.dataset.act === 'app-up' ? -1 : 1);
      [cfg.apps[i], cfg.apps[j]] = [cfg.apps[j], cfg.apps[i]]; saveCfg(); return render();
    }
    case 'app-del':
      if (!confirm(`ลบแอป "${cfg.apps[i].name}" ?`)) return;
      { const id = cfg.apps[i].id; cfg.apps.splice(i,1); cfg.users.forEach(u => u.apps = (u.apps||[]).filter(x => x !== id)); }
      saveCfg(); return render();
    case 'user-new': return userDlg(null);
    case 'user-edit': return userDlg(i);
    case 'user-del':
      if (cfg.users[i].username === me.username) return;
      if (!confirm(`ลบผู้ใช้ "${cfg.users[i].username}" ?`)) return;
      cfg.users.splice(i,1); saveCfg(); return render();
    case 'export': {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'}));
      a.download = 'config.json'; a.click(); URL.revokeObjectURL(a.href); return;
    }
    case 'import': return $('#importFile').click();
    case 'reset-local':
      if (!confirm('ล้างข้อมูลที่แก้ไขในเบราว์เซอร์นี้ แล้วกลับไปใช้ config.json บนเว็บ ?')) return;
      localStorage.removeItem(LS_CFG); sessionStorage.removeItem(SS_ME); return loadCfg().then(render);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'importFile' && t.files[0] && isAdmin(me)){
    t.files[0].text().then(txt => {
      let c; try { c = JSON.parse(txt); } catch {}
      if (!validCfg(c) || !c.users.some(isAdmin)) return alert('ไฟล์ไม่ถูกต้อง (ต้องมี apps, users และ Admin อย่างน้อย 1 คน)');
      cfg = c; saveCfg(); render();
    });
    return;
  }
  if (!isAdmin(me)) return;
  if (t.id === 'newsBox'){
    cfg.news = t.value.split('\n').map(s => s.trim()).filter(Boolean); saveCfg(); return render();
  }
  if (t.dataset.perm){
    const [un, id] = t.dataset.perm.split('|');
    const u = cfg.users.find(x => x.username === un); if (!u) return;
    const s = new Set(u.apps || []); t.checked ? s.add(id) : s.delete(id);
    u.apps = [...s]; saveCfg(); render();
  } else if (t.dataset.permall){
    const u = cfg.users.find(x => x.username === t.dataset.permall); if (!u) return;
    u.apps = t.checked ? cfg.apps.map(a => a.id) : []; saveCfg(); render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  q = e.target.value; render();
  const el = $('#q'); el.focus(); el.setSelectionRange(q.length, q.length);
});

/* ---------------- ติดตั้งเป็นแอป (PWA) ---------------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEvt = null;
const installBtn = document.createElement('button');
installBtn.className = 'btn primary install-btn';
installBtn.innerHTML = '<img src="favicon.png" alt=""> ติดตั้งแอป';
installBtn.hidden = true;
document.body.appendChild(installBtn);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
window.addEventListener('appinstalled', () => { installEvt = null; installBtn.hidden = true; });
installBtn.onclick = async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice;
  installEvt = null; installBtn.hidden = true;
};

loadCfg().then(render);
</script>

</html>
